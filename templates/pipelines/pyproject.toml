# Settings for the tools; the dependencies are in requirements.txt.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The catalog's HTML templates have long lines.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["_eurostat", "_lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
