# Prove every pipeline on each pull request and comment the contract in
# plain words. Make `check` a required status check of `main` (README,
# "Protect main"): merging is the approval.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Annotations on the transforms that are not proved, the contract on
      # the job's summary page, and comment.md for the pull request.
      - run: python scripts/lake.py check --out check.json --comment comment.md
      - if: always() && github.event_name == 'pull_request' && hashFiles('comment.md') != ''
        # A pull request from a fork gets a read-only token: no comment there.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sticky-comment.sh "${{ github.event.pull_request.number }}" "<!-- sverify-check -->" comment.md
