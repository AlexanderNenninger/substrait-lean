[project]
name = "sverify-dbt"
version = "0.1.0"
description = "Check a dbt project's tests and model contracts with sverify, before the models run"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
    # sverify from substrait-lean's main while its API settles
    # ([tool.uv.sources] below); `sverify>=<release>` once it has.
    "sverify",
    # Rewrites the relations of each model's compiled SQL to its inputs' names.
    "sqlglot>=30.17.0",
    # Writes the selectors file (dbt depends on it too).
    "pyyaml>=6.0",
]

[project.scripts]
sverify-dbt = "sverify_dbt.cli:main"

[project.urls]
Source = "https://github.com/AlexanderNenninger/sverify-dbt"
Issues = "https://github.com/AlexanderNenninger/sverify-dbt/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sverify_dbt"]

[dependency-groups]
dev = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.sources]
# sverify from the substrait-lean commit scripts/sverify.sh checked out
# (main by default); `SVERIFY_PREBUILT_CHECK` links the checker it built.
# Drop this for `sverify>=<release>` once sverify's API settles.
sverify = { path = "vendor/substrait-lean/python", editable = true }

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", "examples"]
