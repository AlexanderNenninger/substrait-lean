  - "all NUMERIC and BIGNUMERIC columns (about 1600 in the catalog): DECIMAL(38,9) as the brief prescribes; BigQuery BIGNUMERIC allows 38 fractional digits and 76 total, so very large or very precise values would not fit. Not listed per column."
  - "all TIMESTAMP columns: TIMESTAMPTZ and DATETIME: TIMESTAMP, as the brief prescribes; the catalog types are authoritative"
unsupported:
  - "external_state_geoportal.state_highway_network.wkt_coordinates: BigQuery type GEOGRAPHY has no DuckDB mapping in the brief (omitted)"
