name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a change on substrait-lean's main that breaks sverify-dbt shows
  # up within a day.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      sverify_ref:
        description: The substrait-lean branch, tag or commit to build against
        required: false
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Lint, typecheck and tests, then the check of the sample project and
# `dbt build` without the tests it proved. sverify comes from substrait-lean's
# main (or the `sverify_ref` of a manual run), resolved to a commit at the
# start of the run and logged in the run's summary (scripts/sverify.sh). Its
# checker's lake build is cached by that commit, and elan's toolchain by
# substrait-lean's lean-toolchain, so an unchanged main builds nothing.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DBT: uv run --no-sync dbt --no-use-colors
      SHOP: --project-dir examples/shop --profiles-dir examples/shop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve substrait-lean's ref to a commit
        id: pin
        env:
          REF: ${{ inputs.sverify_ref || 'main' }}
        run: |
          commit=$(scripts/sverify.sh --resolve "$REF")
          toolchain=$(curl -sSfL "https://raw.githubusercontent.com/AlexanderNenninger/substrait-lean/$commit/lean-toolchain")
          echo "substrait-lean $REF at $commit ($toolchain)"
          echo "Built against substrait-lean \`$REF\` at [\`${commit:0:12}\`](https://github.com/AlexanderNenninger/substrait-lean/commit/$commit), $toolchain" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "commit=$commit"
            echo "toolchain=$toolchain"
          } >> "$GITHUB_OUTPUT"
      - name: Cache elan's toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.toolchain }}
      # An older commit's build restores too: lake rebuilds only what changed.
      - name: Cache the checker's lake build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/substrait-lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.commit }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-
      - name: Install elan
        run: |
          if [ ! -x ~/.elan/bin/lake ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check out sverify and build its checker
        run: scripts/sverify.sh "${{ steps.pin.outputs.commit }}" | tail -1 >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyrefly check
      - run: uv run --no-sync pytest -q
      - name: Check the sample project, and build it without the proved tests
        run: |
          $DBT deps $SHOP
          $DBT compile $SHOP
          uv run --no-sync sverify-dbt check examples/shop --selectors
          $DBT seed $SHOP
          $DBT build $SHOP --exclude selector:sverify_proved
          $DBT test $SHOP --select selector:sverify_proved
