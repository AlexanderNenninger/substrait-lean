version: 2

models:
  - name: customer_revenue_by_category
    config:
      contract: {enforced: true}
    columns:
      - name: customer_id
        data_type: bigint
        constraints:
          - type: primary_key
      - name: books
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: games
        data_type: double
      - name: garden
        data_type: double

  - name: order_status_counts
    config:
      contract: {enforced: true}
    columns:
      - name: customer_id
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [unique]
      - name: placed
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: shipped
        data_type: bigint
      - name: returned
        data_type: bigint

  - name: sales_by_quarter
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [region, quarter]
    columns:
      - name: region
        data_tests: [not_null]
      - name: quarter
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [q1, q2, q3, q4]

  - name: customer_history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, valid_from]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "valid_to > valid_from"
    columns:
      - name: customer_id
        data_tests: [not_null]

  - name: orders_with_city
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: events_unioned
    columns:
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [events, orders]
      - name: amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: subscription_arr
    columns:
      - name: arr
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: org_depth
    columns:
      - name: emp_id
        data_tests: [unique]
