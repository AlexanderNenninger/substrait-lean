name: Use the run's substrait-check
description: >-
  Download the substrait-check the `checker` job built to .lake/build/bin, and
  have sverify use it: the editable install links it (SVERIFY_PREBUILT_CHECK,
  python/hatch_build.py) without running lake, and SVERIFY_CHECK names it.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: substrait-check
        path: .lake/build/bin
    - shell: bash
      run: |
        bin="$PWD/.lake/build/bin/substrait-check"
        chmod +x "$bin"
        echo "SVERIFY_PREBUILT_CHECK=$bin" >> "$GITHUB_ENV"
        echo "SVERIFY_CHECK=$bin" >> "$GITHUB_ENV"
