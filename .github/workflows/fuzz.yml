name: Fuzz

# The nightly fuzz run (#747, `sverify_dev.fuzz_nightly`): the fuzzers in
# batches on their own AWS spot pool (label `aws-fuzz`, at most 4 runners,
# 3 batches at once),
# which PR CI never uses. Each matrix job is one batch of `SECONDS` with its
# own seed, so a spot reclaim loses one batch. `report` folds the batches
# into the ledger (the `fuzz-ledger` artifact, carried from night to night)
# and writes the night's findings, new signatures first, to its summary for
# triage. Nothing is filed anywhere.
#
# Pause: set the repository variable FUZZ_PAUSED to `true` (or
# `gh workflow disable fuzz.yml`). Snowflake stays out of this run.

on:
  schedule:
    - cron: "17 1 * * *"
  # A pull request that changes the run checks it with short batches.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - .github/actions/build-checker/**
      - python/tools/sverify_dev/fuzz_nightly.py
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per batch
        default: "1200"

permissions:
  contents: read

env:
  SECONDS_PER_BATCH: ${{ inputs.seconds || (github.event_name == 'pull_request' && '120') || '1200' }}

jobs:
  checker:
    if: >-
      vars.FUZZ_PAUSED != 'true' && (github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'batch/')))
    runs-on: [self-hosted, linux, x64, aws-fuzz]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-checker

  fuzz:
    needs: checker
    name: fuzz (${{ matrix.suite }})
    runs-on: [self-hosted, linux, x64, aws-fuzz]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Under the pool's 4: a finished job's runner counts until it is gone,
      # and the scale-up drops a job that finds the pool full (no retry).
      max-parallel: 3
      matrix:
        suite:
          - core
          - core
          - core
          - core
          - duckdb:int_overflow
          - duckdb:int_division
          - duckdb:float_arith
          - duckdb:eval_order
          - duckdb:float_special
          - hypothesis:1/6
          - hypothesis:2/6
          - hypothesis:3/6
          - hypothesis:4/6
          - hypothesis:5/6
          - hypothesis:6/6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - env:
          SUITE: ${{ matrix.suite }}
          INDEX: ${{ strategy.job-index }}
          RUN: ${{ github.run_number }}
          # The checker's own cap (#1074); the batch's watchdog caps the tree.
          SVERIFY_CHECKER_MEMORY_MB: "4096"
        run: |
          seed=$((RUN * 100 + INDEX))
          uv run --locked --project python python -m sverify_dev.fuzz_nightly batch "$SUITE" \
            --seed "$seed" --seconds "$SECONDS_PER_BATCH" --out "fuzz-out/batch-$INDEX"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-batch-${{ strategy.job-index }}
          path: fuzz-out
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [checker, fuzz]
    if: always() && needs.checker.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the previous night's ledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-batch-*
          path: batches
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=$(gh run list -R "$REPO" -w fuzz.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n fuzz-ledger -D prev; then
            cp prev/fuzz-ledger.json fuzz-ledger.json
          fi
          python3 python/tools/sverify_dev/fuzz_nightly.py merge \
            --ledger fuzz-ledger.json --report fuzz-report.md batches
          cat fuzz-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-ledger
          path: |
            fuzz-ledger.json
            fuzz-report.md
          retention-days: 90
