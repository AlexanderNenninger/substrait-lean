name: Wheels

# Each wheel bundles the substrait-check binary for its platform, so every
# platform builds on its own runner. Each one builds the sdist and then the
# wheel from it, which checks that the sdist is complete. Tags `v*` also
# publish the wheels and one sdist to PyPI, and then the release's notebooks
# to the `published` branch, which molab opens; PRs that change the packaging
# only build and test. Every platform builds only for releases, the weekly
# run and manual runs; PRs build on x86 Linux alone.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - python/pyproject.toml
      - python/hatch_build.py
      - lean-toolchain
      - lakefile.toml
      - .github/workflows/wheels.yml
      - .github/actions/setup-lean/**
  workflow_dispatch:
    inputs:
      pythons:
        description: Python versions to test the installed wheel on, as a JSON list
        default: '["3.13", "3.14", "3.15"]'
      notebooks:
        description: >-
          Only publish the notebooks of this released version (e.g. 0.2.0) to the
          `published` branch, without building wheels
        default: ""
      dry_run:
        description: >-
          With `notebooks`: rewrite and run this ref's notebooks against that
          version from PyPI, but push nothing
        type: boolean
        default: false
  # Weekly, to notice a newer Python breaking the wheel before a release does.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.notebooks }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform builds only for a release (`push`, which fires only on
        # `v*` tags), the weekly run and when started by hand. A pull request
        # builds on x86 Linux alone: it checks the packaging, and the weekly
        # run catches a problem on the other platforms.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch'
          || github.event_name == 'schedule')
          && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "macos-15-intel"]'
          || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a release wheel is built only from what is in this commit.
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Build sdist, then the wheel from it
        run: uv build python --out-dir dist

      - name: Tag manylinux
        if: runner.os == 'Linux'
        run: |
          uvx --with patchelf auditwheel show dist/*.whl
          uvx --with patchelf auditwheel repair dist/*.whl --wheel-dir wheelhouse
      - name: Collect macOS wheel
        if: runner.os == 'macOS'
        run: mkdir wheelhouse && cp dist/*.whl wheelhouse/

      # Test the installed wheel, not the source tree: copy the tests out so
      # `sverify` can only come from the wheel. The tests also need the
      # maintainer tooling, which the wheel leaves out (`python/tools`).
      - name: Test installed wheel
        run: |
          cp -r python/tests "$RUNNER_TEMP/tests"
          cp -r python/tools "$RUNNER_TEMP/tools"
          export PYTHONPATH="$RUNNER_TEMP/tools"
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project \
            --with "sverify[all] @ file://$wheel" \
            --with pytest --with hypothesis \
            --with "pyiceberg[sql-sqlite]" \
            pytest -p no:cacheprovider -W "ignore:The 'future.infer_string' option is deprecated" tests

      # Without extras the wheel has no DataFusion, and needs none on DuckDB.
      - name: Run the installed wheel without DataFusion
        run: |
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" python - <<'PY'
          import importlib.util
          import pyarrow as pa
          import sverify as sv
          from sverify.io import StaticSource

          assert importlib.util.find_spec("datafusion") is None, "datafusion is installed"
          t = StaticSource(pa.table({"a": [1, 5]}), name="t")

          @sv.transform()
          def big(t):
              return t.filter(t.a > 2)

          node = big(t)
          node.refresh()
          t.apply(sv.Changes(inserts=[(7,)]))
          node.refresh()
          rows = sorted(r["a"] for r in node.to_arrow().to_pylist())
          assert rows == [5, 7], rows
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # The wheel is tagged `py3-none-<platform>`, so it installs on every Python
  # from 3.12 on. Test the very wheel `build` made (no rebuild) on the newer
  # ones: on releases, by hand and weekly, not on pull requests.
  # Which Pythons test-pythons runs on which platform: every one on Linux,
  # and only the oldest and the newest on macOS, whose runners are scarce and
  # cost more. The versions in between have the same macOS build and differ
  # from the outer ones only in CPython, which Linux covers.
  test-matrix:
    if: github.event_name != 'pull_request' && !inputs.notebooks
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          PYTHONS: ${{ inputs.pythons || '["3.13", "3.14", "3.15"]' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          pythons = sorted(json.loads(os.environ["PYTHONS"]), key=lambda v: tuple(map(int, v.split("."))))
          edges = sorted({pythons[0], pythons[-1]}, key=pythons.index)
          include = [{"os": os_, "python": p} for os_ in ("ubuntu-latest", "ubuntu-24.04-arm") for p in pythons]
          include += [{"os": os_, "python": p} for os_ in ("macos-15", "macos-15-intel") for p in edges]
          print("include=" + json.dumps(include))
          PY

  test-pythons:
    if: github.event_name != 'pull_request'
    needs: [build, test-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A prerelease Python (3.15 before October 2026) is used while it is the
      # only one of its version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse

      - name: Test installed wheel
        run: |
          cp -r python/tests "$RUNNER_TEMP/tests"
          cp -r python/tools "$RUNNER_TEMP/tools"
          export PYTHONPATH="$RUNNER_TEMP/tools"
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python ${{ matrix.python }} \
            --with "sverify[all] @ file://$wheel" \
            --with pytest --with hypothesis \
            --with "pyiceberg[sql-sqlite]" \
            pytest -p no:cacheprovider -W "ignore:The 'future.infer_string' option is deprecated" tests

      - name: Run the installed wheel without DataFusion
        run: |
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python ${{ matrix.python }} --with "$wheel" python - <<'PY'
          import importlib.util
          import pyarrow as pa
          import sverify as sv
          from sverify.io import StaticSource

          assert importlib.util.find_spec("datafusion") is None, "datafusion is installed"
          t = StaticSource(pa.table({"a": [1, 5]}), name="t")

          @sv.transform()
          def big(t):
              return t.filter(t.a > 2)

          node = big(t)
          node.refresh()
          t.apply(sv.Changes(inserts=[(7,)]))
          node.refresh()
          rows = sorted(r["a"] for r in node.to_arrow().to_pylist())
          assert rows == [5, 7], rows
          PY

  # Weekly: each tour notebook in the sandbox its own header describes, with
  # sverify from this checkout, as molab runs the published ones. CI runs them
  # in the full development environment, so only this sees a header that
  # misses an extra (#197). About a minute per notebook, so not on every PR.
  notebooks-sandbox:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - working-directory: notebooks
        run: |
          out=$(mktemp -d); failed=()
          for nb in [0-9]*.py; do
            echo "::group::$nb"
            uvx marimo export html --sandbox "$nb" -o "$out/${nb%.py}.html" || failed+=("$nb")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} notebook(s) failed in their own sandbox: ${failed[*]}"
            exit 1
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    # A release that breaks on a newer Python is not published.
    needs: [build, test-pythons]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # molab opens notebooks straight from GitHub, so the README's links point at
  # the `published` branch: the release's notebooks, rewritten to install that
  # version from PyPI (`python/scripts/publish_notebooks.py`), one commit per
  # release, never force-pushed. On a tag it runs after `publish`; by hand,
  # with `notebooks: <version>`, it republishes a release.
  publish-notebooks:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || inputs.notebooks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.notebooks || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The release's own notebooks, except in a dry run (this ref's).
      - name: Rewrite the notebooks for the release
        run: |
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          src=notebooks
          if [ "$DRY_RUN" = false ] && [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            git fetch -q --depth 1 origin tag "v$VERSION"
            src="$RUNNER_TEMP/src/notebooks"
            mkdir -p "$RUNNER_TEMP/src"
            git archive "v$VERSION" notebooks | tar -x -C "$RUNNER_TEMP/src"
          fi
          uv run --no-project python python/scripts/publish_notebooks.py \
            "$VERSION" "$src" "$RUNNER_TEMP/published"

      # PyPI's index can lag the upload by a few minutes.
      - name: Wait until PyPI serves the release
        run: |
          echo "sverify==$VERSION" > "$RUNNER_TEMP/req.txt"
          for _ in $(seq 30); do
            uv pip compile -q --refresh --no-deps "$RUNNER_TEMP/req.txt" > /dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "PyPI does not serve sverify==$VERSION"; exit 1

      # Outside the repository, each in the sandbox its header describes. A dry
      # run against an older release may fail on features it lacks: it shows
      # the failures and goes on.
      - name: Run the published notebooks against the release
        working-directory: ${{ runner.temp }}/published/notebooks
        run: |
          out=$(mktemp -d); failed=()
          for nb in [0-9]*.py; do
            echo "::group::$nb"
            uvx marimo export html --sandbox "$nb" -o "$out/${nb%.py}.html" || failed+=("$nb")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} notebook(s) failed: ${failed[*]}"
            [ "$DRY_RUN" = true ] || exit 1
          fi

      - name: Commit to the published branch
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -c http.extraheader="$auth" fetch -q --depth 1 origin published; then
            git checkout -q -b published FETCH_HEAD
          else
            git checkout -q --orphan published
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/published/." .
          git add -A
          if git diff --cached --quiet; then
            echo "published already holds the notebooks of $VERSION"; exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Notebooks of sverify $VERSION"
          git -c http.extraheader="$auth" push origin published
