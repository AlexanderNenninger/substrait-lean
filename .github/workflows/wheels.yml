name: Wheels

# Each wheel bundles the substrait-check binary for its platform, so every
# platform builds on its own runner. Each one builds the sdist and then the
# wheel from it, which checks that the sdist is complete. Tags `v*` also
# publish the wheels and one sdist to PyPI, and then the release's notebooks
# to the `published` branch, which molab opens; PRs that change the packaging
# only build and test. Every platform builds only for releases, the nightly
# and weekly runs and manual runs; PRs build on x86 Linux alone. The nightly
# run publishes the wheels of `main` as the rolling `nightly` GitHub
# pre-release (job `nightly`), never to PyPI.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - python/pyproject.toml
      - python/hatch_build.py
      - dbt/pyproject.toml
      - lean-toolchain
      - lakefile.lean
      - .github/workflows/wheels.yml
      - .github/actions/setup-lean/**
  workflow_dispatch:
    inputs:
      pythons:
        description: Python versions to test the installed wheel on, as a JSON list
        default: '["3.13", "3.14", "3.15"]'
      notebooks:
        description: >-
          Only publish the notebooks of this released version (e.g. 0.2.0) to the
          `published` branch, without building wheels
        default: ""
      dry_run:
        description: >-
          With `notebooks`: rewrite and run this ref's notebooks against that
          version from PyPI, but push nothing. With `nightly`: build and test
          the nightly wheels, but publish nothing
        type: boolean
        default: false
      nightly:
        description: >-
          Build nightly wheels and publish them as this GitHub pre-release
          (`nightly` only from main; another name for a scratch release)
        default: ""
  # Weekly, to notice a newer Python breaking the wheel before a release does.
  # Nightly, to publish the wheels of `main` (job `nightly`).
  schedule:
    - cron: "17 4 * * 1"
    - cron: "41 2 * * *"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether to build, and the nightly version. Every run passes it: a skipped
  # job would skip `build`'s dependents too. The nightly cron builds only when
  # `main` moved past the commit the `nightly` tag points at. A nightly wheel
  # is `<next minor>.dev<commits on main>+g<sha>`, so uv and pip order nightlies
  # by commit and after the last release.
  nightly:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - if: github.event.schedule == '41 2 * * *' || inputs.nightly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          NIGHTLY: ${{ (github.event.schedule == '41 2 * * *' && 'nightly') || inputs.nightly }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NIGHTLY" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A `v*` tag would start a PyPI release.
          case "$NIGHTLY" in v*) echo "::error::$NIGHTLY looks like a release tag"; exit 1 ;; esac
          if [ "$NIGHTLY" = nightly ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::the nightly release is built from main, not $GITHUB_REF"; exit 1
          fi
          case "$GITHUB_REF" in refs/heads/*) ;; *) echo "::error::nightlies build from a branch"; exit 1 ;; esac
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NIGHTLY" -q .object.sha 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::$NIGHTLY already holds $GITHUB_SHA"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          release=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          IFS=. read -r major minor _ <<< "${release#v}"
          version="$major.$((minor + 1)).0.dev$(git rev-list --count HEAD)+g$(git rev-parse --short=7 HEAD)"
          echo "::notice::$NIGHTLY: sverify $version"
          { echo "build=true"; echo "tag=$NIGHTLY"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  build:
    needs: nightly
    if: ${{ !inputs.notebooks && needs.nightly.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform builds only for a release (`push`, which fires only on
        # `v*` tags), the weekly run and when started by hand. A pull request
        # builds on x86 Linux alone: it checks the packaging, and the weekly
        # run catches a problem on the other platforms.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch'
          || github.event_name == 'schedule')
          && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-15"]'
          || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a release wheel is built only from what is in this commit.
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The engine packages (`engines/<engine>/`, #1189) go out at sverify's
      # version, pinned both ways: sverify's extra pins the package, the
      # package pins sverify.
      - name: Check the engine packages' versions and pins
        run: |
          sverify=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          for e in polars spark; do
            grep -x "version = \"$sverify\"" engines/$e/pyproject.toml
            grep -F "\"sverify==$sverify\"" engines/$e/pyproject.toml
            grep -E "\"sverify-$e(\[[a-z]+\])?==$sverify\"" python/pyproject.toml
          done

      # Only in the build: the commit keeps the released version.
      - name: Set the nightly version
        if: needs.nightly.outputs.version
        env:
          VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          sed -i.orig "s/^version = \".*\"/version = \"$VERSION\"/; s/\"\(sverify-[a-z]*\(\[[a-z]*\]\)\{0,1\}\)==[^\"]*\"/\"\1==$VERSION\"/" \
            python/pyproject.toml
          for e in polars spark; do
            sed -i.orig "s/^version = \".*\"/version = \"$VERSION\"/; s/\"sverify==[^\"]*\"/\"sverify==$VERSION\"/" \
              engines/$e/pyproject.toml
            rm engines/$e/pyproject.toml.orig
          done
          rm python/pyproject.toml.orig
          grep -x "version = \"$VERSION\"" python/pyproject.toml engines/*/pyproject.toml

      - name: Build sdist, then the wheel from it
        run: uv build python --out-dir dist
      # Pure Python: the wheel tests install it beside sverify's wheel.
      - name: Build the engine packages
        run: |
          uv build engines/polars --out-dir dist-polars
          uv build engines/spark --out-dir dist-spark

      - name: Tag manylinux
        if: runner.os == 'Linux'
        run: |
          uvx --with patchelf auditwheel show dist/*.whl
          uvx --with patchelf auditwheel repair dist/*.whl --wheel-dir wheelhouse
      - name: Collect macOS wheel
        if: runner.os == 'macOS'
        run: mkdir wheelhouse && cp dist/*.whl wheelhouse/

      # Test the installed wheel, not the source tree: `wheel_tests.sh`
      # copies the tests out so `sverify` can only come from the wheel (CI's
      # `outside-repo` job runs the same script on every pull request).
      #
      # A pull request runs the fast set (`poe test`'s: no `slow` tests, a
      # tenth of the Hypothesis examples): it checks the packaging, and CI's
      # `test` jobs run the whole suite on the same code from source. A
      # release, the nightly and the weekly run test the whole suite here,
      # and so does a release's version-bump pull request (`release-*`), so
      # a test the wheel fails shows up before the tag.
      - name: Test installed wheel
        env:
          FAST: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-') && !startsWith(github.base_ref, 'release/') }}
        run: |
          fast=()
          if [ "$FAST" = true ]; then fast=(--fast); fi
          bash python/scripts/wheel_tests.sh --wheel wheelhouse/*.whl \
            --engine-wheel dist-polars/*.whl --engine-wheel dist-spark/*.whl ${fast[@]+"${fast[@]}"}

      # Without extras: no optional package is installed or imported, a node
      # refreshes on DuckDB, `sverify check` runs, and `import sverify` stays
      # under a budget (python/scripts/check_plain_wheel.py).
      - name: Run the installed wheel without extras
        run: |
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          script="$PWD/python/scripts/check_plain_wheel.py"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$wheel" python "$script" --import-budget 5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
      # `engine-*`, not `dist-*`: `publish` uploads it to PyPI only once the
      # project has a trusted publisher (`vars.PUBLISH_ENGINES`, the release
      # skill's "Engine packages").
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-polars
          path: dist-polars/*
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-spark
          path: dist-spark/*

  # sverify-dbt (`dbt/`, #732): pure Python, released with sverify at its
  # version, so one runner builds its sdist and wheel. The wheel is checked
  # against this run's sverify wheel, and goes out with it (`dist-dbt`, which
  # `publish` and `publish-nightly` take with the other `dist-*`).
  build-dbt:
    needs: [nightly, build]
    if: ${{ !inputs.notebooks && needs.nightly.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check sverify-dbt's version and pin, and set the nightly one
        env:
          VERSION: ${{ needs.nightly.outputs.version }}
        run: |
          sverify=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          grep -x "version = \"$sverify\"" dbt/pyproject.toml
          grep -F "\"sverify==$sverify\"" dbt/pyproject.toml
          if [ -n "$VERSION" ]; then
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/; s/\"sverify==[^\"]*\"/\"sverify==$VERSION\"/" \
              dbt/pyproject.toml
            grep -x "version = \"$VERSION\"" dbt/pyproject.toml
          fi
      - name: Build sdist, then the wheel from it
        run: uv build dbt --out-dir dist-dbt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-ubuntu-latest
          path: wheelhouse
      - name: Install both wheels and run the CLI
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          uv pip install wheelhouse/sverify-*.whl dist-dbt/sverify_dbt-*.whl
          sverify-dbt check --help > /dev/null
          python -c "import sverify_dbt; print(sverify_dbt.__all__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-dbt
          path: dist-dbt/*

  # The wheel is tagged `py3-none-<platform>`, so it installs on every Python
  # from 3.12 on. Test the very wheel `build` made (no rebuild) on the newer
  # ones: on releases, by hand and weekly, not on pull requests.
  # Which Pythons test-pythons runs on which platform: every one on Linux,
  # and only the oldest and the newest on macOS, whose runners are scarce and
  # cost more. The versions in between have the same macOS build and differ
  # from the outer ones only in CPython, which Linux covers.
  test-matrix:
    if: github.event_name != 'pull_request' && !inputs.notebooks
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          PYTHONS: ${{ inputs.pythons || '["3.13", "3.14", "3.15"]' }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          pythons = sorted(json.loads(os.environ["PYTHONS"]), key=lambda v: tuple(map(int, v.split("."))))
          edges = sorted({pythons[0], pythons[-1]}, key=pythons.index)
          # The whole suite on the newest Python (`build` runs it on the
          # oldest, 3.12), the fast set on those between: the code is pure
          # Python apart from the checker, so a middle version rarely fails
          # alone.
          newest = pythons[-1]
          include = [{"os": os_, "python": p, "full": p == newest}
                     for os_ in ("ubuntu-latest", "ubuntu-24.04-arm") for p in pythons]
          include += [{"os": "macos-15", "python": p, "full": p == newest} for p in edges]
          print("include=" + json.dumps(include))
          PY

  test-pythons:
    if: github.event_name != 'pull_request'
    needs: [build, test-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A prerelease Python (3.15 before October 2026) is used while it is the
      # only one of its version.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-polars
          path: dist-polars
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-spark
          path: dist-spark

      - name: Test installed wheel
        env:
          FULL: ${{ matrix.full }}
        run: |
          fast=()
          if [ "$FULL" != true ]; then fast=(--fast); fi
          bash python/scripts/wheel_tests.sh --wheel wheelhouse/*.whl --engine-wheel dist-polars/*.whl \
            --engine-wheel dist-spark/*.whl \
            --python ${{ matrix.python }} ${fast[@]+"${fast[@]}"}

      # Without extras: no optional package is installed or imported, a node
      # refreshes on DuckDB, `sverify check` runs, and `import sverify` stays
      # under a budget (python/scripts/check_plain_wheel.py).
      - name: Run the installed wheel without extras
        run: |
          wheel=$(ls "$PWD"/wheelhouse/*.whl)
          script="$PWD/python/scripts/check_plain_wheel.py"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python ${{ matrix.python }} --with "$wheel" python "$script" --import-budget 5

  # Weekly: each tour notebook in the sandbox its own header describes, with
  # sverify from this checkout, as molab runs the published ones. CI runs them
  # in the full development environment, so only this sees a header that
  # misses an extra (#197). About a minute per notebook, so not on every PR.
  notebooks-sandbox:
    if: github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - working-directory: notebooks
        run: |
          out=$(mktemp -d); failed=()
          for nb in [0-9]*.py; do
            echo "::group::$nb"
            uvx marimo export html --sandbox "$nb" -o "$out/${nb%.py}.html" || failed+=("$nb")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} notebook(s) failed in their own sandbox: ${failed[*]}"
            exit 1
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && !needs.nightly.outputs.version
    # A release that breaks on a newer Python is not published.
    needs: [nightly, build, build-dbt, test-pythons]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          # sverify-dbt goes out at the same version, pinned to this sverify.
          dbt=$(sed -n 's/^version = "\(.*\)"/\1/p' dbt/pyproject.toml)
          test "$dbt" = "$version" || { echo "dbt/ is at $dbt, sverify at $version"; exit 1; }
          grep -F "\"sverify==$version\"" dbt/pyproject.toml
          # So do the engine packages, pinned both ways.
          for e in polars spark; do
            grep -x "version = \"$version\"" engines/$e/pyproject.toml
            grep -F "\"sverify==$version\"" engines/$e/pyproject.toml
            grep -E "\"sverify-$e(\[[a-z]+\])?==$version\"" python/pyproject.toml
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The engine packages, once PyPI has a trusted publisher for each
      # (`vars.PUBLISH_ENGINES`; the release skill's "Engine packages").
      - if: vars.PUBLISH_ENGINES == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # molab opens notebooks straight from GitHub, so the README's links point at
  # the `published` branch: the release's notebooks, rewritten to install that
  # version from PyPI (`python/scripts/publish_notebooks.py`), one commit per
  # release, never force-pushed. On a tag it runs after `publish`; by hand,
  # with `notebooks: <version>`, it republishes a release.
  publish-notebooks:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || inputs.notebooks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.notebooks || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The release's own notebooks, except in a dry run (this ref's).
      - name: Rewrite the notebooks for the release
        run: |
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          src=notebooks
          if [ "$DRY_RUN" = false ] && [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            git fetch -q --depth 1 origin tag "v$VERSION"
            src="$RUNNER_TEMP/src/notebooks"
            mkdir -p "$RUNNER_TEMP/src"
            git archive "v$VERSION" notebooks | tar -x -C "$RUNNER_TEMP/src"
          fi
          uv run --no-project python python/scripts/publish_notebooks.py \
            "$VERSION" "$src" "$RUNNER_TEMP/published"

      # PyPI's index can lag the upload by a few minutes.
      - name: Wait until PyPI serves the release
        run: |
          echo "sverify==$VERSION" > "$RUNNER_TEMP/req.txt"
          for _ in $(seq 30); do
            uv pip compile -q --refresh --no-deps "$RUNNER_TEMP/req.txt" > /dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "PyPI does not serve sverify==$VERSION"; exit 1

      # Outside the repository, each in the sandbox its header describes. A dry
      # run against an older release may fail on features it lacks: it shows
      # the failures and goes on.
      - name: Run the published notebooks against the release
        working-directory: ${{ runner.temp }}/published/notebooks
        run: |
          out=$(mktemp -d); failed=()
          for nb in [0-9]*.py; do
            echo "::group::$nb"
            uvx marimo export html --sandbox "$nb" -o "$out/${nb%.py}.html" || failed+=("$nb")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} notebook(s) failed: ${failed[*]}"
            [ "$DRY_RUN" = true ] || exit 1
          fi

      - name: Commit to the published branch
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -c http.extraheader="$auth" fetch -q --depth 1 origin published; then
            git checkout -q -b published FETCH_HEAD
          else
            git checkout -q --orphan published
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/published/." .
          git add -A
          if git diff --cached --quiet; then
            echo "published already holds the notebooks of $VERSION"; exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Notebooks of sverify $VERSION"
          git -c http.extraheader="$auth" push origin published

  # The rolling nightly pre-release: the tag moves to the built commit and the
  # new wheels go up next to the earlier builds' (their names differ by
  # version), so a pinned wheel URL keeps working. Wheels older than
  # `KEEP_DAYS` go. It is never marked latest, and its tag never starts with
  # `v`, so `publish` never sees it.
  publish-nightly:
    if: needs.nightly.outputs.version
    needs: [nightly, build, build-dbt, test-pythons]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.nightly.outputs.tag }}
      VERSION: ${{ needs.nightly.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_DAYS: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # The engine packages' wheels too: a GitHub release, so no publisher.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          page="https://github.com/$GH_REPO/releases/expanded_assets/$TAG"
          cat > notes.md <<NOTES
          Wheels of \`main\` at $GITHUB_SHA, built $(date -u +%Y-%m-%d), version \`$VERSION\`.
          The nightly run adds newer ones when \`main\` changes, and each build's wheels
          stay here for $KEEP_DAYS days, so a pinned wheel URL works that long. They are not on PyPI.

          \`\`\`bash
          uv add "sverify>=${VERSION%%.dev*}.dev0" --find-links $page
          pip install --pre sverify --find-links $page
          \`\`\`

          uv does not record the page, so add it to your \`pyproject.toml\`, and run
          \`uv lock --upgrade-package sverify\` for a newer nightly:

          \`\`\`toml
          [tool.uv]
          find-links = ["$page"]
          \`\`\`
          NOTES
          cat notes.md; ls dist/*.whl

      - name: Publish
        run: |
          if [ "$DRY_RUN" = true ]; then echo "dry run: $TAG not changed"; exit 0; fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --title "Nightly wheels" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --prerelease --latest=false --title "Nightly wheels" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.whl --clobber
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          release=$(gh api "repos/$GH_REPO/releases/tags/$TAG" -q .id)
          gh api --paginate "repos/$GH_REPO/releases/$release/assets?per_page=100" \
            -q ".[] | select(.created_at < \"$cutoff\") | .name" |
            while read -r name; do
              [ -e "dist/$name" ] || gh release delete-asset "$TAG" "$name" --yes
            done
