name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  merge_group:
  # `retarget.yml` starts a run when a pull request is retargeted to main.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request whose merge with main to test (empty for the branch itself)
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `poe qa`, split into jobs that run side by side. A push to main, a merge
# queue entry and a run `retarget.yml` starts run everything; the rules below
# apply to pull requests, and `changes` decides them.
#
# `checker` builds substrait-check once per run (cached by a hash of the Lean
# sources, the lakefile and the toolchain) and every job that runs sverify
# downloads it (`.github/actions/checker`), so their editable installs link it
# without running lake.
#
# `lean` checks every proof, the generated entries' included
# (`-Kcheck_generated=true`), when a `.lean` file, the lakefile, the manifest
# or the toolchain changes (the generators and `Profile.duckdb` are `.lean`
# files). Otherwise no proof can change, and `golden` runs the golden tests on
# the shared checker.
#
# A pull request that changes only docs (`docs/`, `.claude/`, `changelog.d/`,
# Markdown at the root), other than a page whose examples
# python/tests/test_readme.py runs (its `READMES`), skips
# everything but `static`, and float-bounds runs only when its own package
# changes. The TLA+ models (`models/`) count as docs for the other jobs:
# `refresh-model` checks them, when they change.
#
# A pull request that changes only the ledgers (the facts of
# `characterization/<engine>/facts/`, `characterization/*.json`, the probes'
# `probes.json`, Markdown, `upstream/`, `python/tests/lift_backlog.json`,
# plus docs) runs `static` and `ledger`: the checkers of those records and the
# tests that read them. The replay ledgers `engines/duckdb/replay/<area>.json`
# and `characterization/oracle-a/` feed oracle A, so they run everything.
#
# Three jobs read fewer files than the others on a pull request, and run in
# full in a merge batch (`batch/*`), on main and on release branches:
# `outside-repo` (the tests from a copy outside the repository) runs when the
# packaging, the tests or a data file of the package change; `evidence` (the
# Ibis and validator replays) and the dbt packages' replay step (`dbt`) run
# when the package's code (not its I/O, CLI, skills or schemas) or an engine
# package's code, the lock files, their own ledgers or a Lean input change. All three report and never fail a run, or
# (`outside-repo`) repeat what `test` runs from the source.
#
# The other pull requests run `test (core)` and `test (duckdb)` always, and
# skip a job when every file they change is one the job cannot read: the
# table of areas in `changes` lists, for each job, the areas it skips. A file
# outside every area (shared translation code, the lift, the SQL writer, Lean,
# the dependencies, CI) runs every job.
#
# A push to main skips everything but `static` when a pull request's run
# already tested the same tree: the push is the merge commit of a pull request
# whose head contains the old main (so the merge changes nothing), its CI run
# on that head passed, and the merge changes no Lean input (whose lake cache
# `lean` saves on main for the pull requests after it). The batch merger's
# merges are such pushes; testing them twice held runner slots for nothing.
#
# A release branch (`release/<major>.<minor>`, cut from main for a release)
# counts as main: pushes to it and pull requests into it run everything, so
# a release is tested on its branch while main moves on.
#
# A pull request into another branch than main or a release branch (a
# stacked one) runs `static`
# only, and `qa` fails, saying so: a green `qa` would stay on the commit after
# the retarget to main, while the full run that replaces it is still going.
# When the pull request is retargeted to main, `retarget.yml` starts this
# workflow on it (`workflow_dispatch`), which runs everything on its merge
# with main.
#
# Most jobs run on the self-hosted AWS runners (ephemeral spot instances,
# 4 vCPU, 16 GB, at most 8 at once; GitHub's hosted ones are the same size),
# which leaves GitHub's 20 job slots free. `route` picks the runner: the AWS
# runners only for pull requests from this repository (never a fork's; never
# a batch branch `batch/*`, pushes, merge queue entries or dispatches, whose
# `qa` the merge tooling waits for: a job queued for lack of a spot instance
# would stall it), and only when `aws-probe` starts within 3 minutes;
# otherwise ubuntu-latest. The repository variable `AWS_RUNNERS` set to `off`
# skips the probe, so every job runs on GitHub's runners (`gh variable set
# AWS_RUNNERS --body off`; delete it, or set it to anything else, to use AWS
# again): with no runners left, the probe would queue for good.
#
# The longest jobs (`lean`, `evidence`, `dbt`, `outside-repo`) may run on the
# fixed Hetzner hosts instead (agentic-tools/hetzner-runner: two x86 servers
# in Helsinki, six slots of 4 vCPU and about 7.5 GB, each job in a fresh
# container, label `hetzner`), when the repository variable `HETZNER_RUNNERS`
# is `on` and `hetzner-probe` starts within the same 3 minutes; otherwise
# they go where the other jobs go. Only those four: a whole run would take
# every slot at once. `gh variable set HETZNER_RUNNERS --body on` turns it
# on, `off` (or deleting it) off. (The checker and cache steps still handle
# an ARM runner, from the first plan; on x86 those branches never run.)
#
# `changes`, `qa`, the Spark tests, `bench` (its budgets assume
# GitHub's CPUs), `float-bounds` and `refresh-model` always run on GitHub's
# runners.
jobs:
  # Where the jobs below run (see the header): GitHub's runners, or the
  # self-hosted AWS runners when one picks `aws-probe` up in time (`runner`),
  # and for the four longest jobs the Hetzner host when it picks
  # `hetzner-probe` up in time (`heavy`, else the same as `runner`). Both are
  # a JSON `runs-on`. This job never fails: any doubt answers GitHub's runners.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to read the probes' status
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      heavy: ${{ steps.pick.outputs.heavy }}
    steps:
      - id: pick
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's runners unless the loop below finds a self-hosted one.
          echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          echo 'heavy="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          # The probes run only for this repository's own pull requests (they
          # are skipped for forks, batch branches and other events, and when
          # their repository variable is off). Spot launch and boot take about
          # a minute; past 3 minutes a probe is still queued (no capacity,
          # runners busy with other runs) and GitHub's runners take its jobs.
          url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          state() { # up, no or wait for probe $1, from $jobs
            case "$(sed -n "s/^$1 //p" <<<"$jobs")" in
              "in_progress "*|"completed success") echo up;;
              "completed "*) echo no;;
              *) echo wait;;
            esac
          }
          aws=wait hz=wait
          for _ in $(seq 36); do
            jobs=$(gh api "$url" --jq '.jobs[]|select(.name=="aws-probe" or .name=="hetzner-probe")|.name+" "+.status+" "+(.conclusion//"")') || jobs=
            [ "$aws" = wait ] && aws=$(state aws-probe)
            [ "$hz" = wait ] && hz=$(state hetzner-probe)
            [ "$aws" != wait ] && [ "$hz" != wait ] && break
            sleep 5
          done
          echo "AWS probe: $aws; Hetzner probe: $hz."
          light='"ubuntu-latest"'
          [ "$aws" = up ] && light='["self-hosted","linux","x64","aws"]'
          heavy=$light
          [ "$hz" = up ] && heavy='["self-hosted","linux","X64","hetzner"]'
          echo "runner=$light" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          [ "$aws" != wait ] || echo "::warning::No AWS runner picked up the probe in 3 minutes: those jobs run on GitHub's runners."
          [ "$hz" != wait ] || echo "::warning::No Hetzner runner picked up the probe in 3 minutes: the long jobs run on $light."

  # Starts an AWS runner (ephemeral: one job each) so `route` can tell whether
  # one is available; it queues until one starts, and a run with no runner
  # leaves it queued (GitHub has no queue timeout) until the next push to the
  # branch cancels the run. No other job needs it.
  aws-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'batch/') && vars.AWS_RUNNERS != 'off'
    runs-on: [self-hosted, linux, x64, aws]
    timeout-minutes: 2
    steps:
      - run: echo "AWS runner $(hostname) is up"

  # The same for the Hetzner hosts (fixed servers, each job in a fresh
  # container): it queues until a slot is free. Off unless the repository
  # variable `HETZNER_RUNNERS` is `on`.
  hetzner-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'batch/') && vars.HETZNER_RUNNERS == 'on'
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 2
    steps:
      - run: echo "Hetzner runner $(hostname) is up"

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the pull request's run of the same tree
    outputs:
      code: ${{ steps.diff.outputs.code }}
      floats: ${{ steps.diff.outputs.floats }}
      ledger: ${{ steps.diff.outputs.ledger }}
      backlog: ${{ steps.diff.outputs.backlog }}
      upstack: ${{ steps.diff.outputs.upstack }}
      proofs: ${{ steps.diff.outputs.proofs }}
      oracle: ${{ steps.diff.outputs.oracle }}
      notebooks: ${{ steps.diff.outputs.notebooks }}
      dbt: ${{ steps.diff.outputs.dbt }}
      dbtreplay: ${{ steps.diff.outputs.dbtreplay }}
      evidence: ${{ steps.diff.outputs.evidence }}
      python: ${{ steps.diff.outputs.python }}
      models: ${{ steps.diff.outputs.models }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          docs='^(docs/|\.claude/|changelog\.d/|models/|[^/]+\.md$)'
          ledger='^(upstream/|characterization/([^/]+\.json$|[^/]+/facts/|[^/]+/probes\.json$|.*\.md$)|engines/[^/]+/(facts|probes|replay)/|python/tests/lift_backlog\.json$)'

          # The areas: files that only one job, or no job but `test (core)`
          # and `test (duckdb)`, can read.
          src=python/src/sverify
          tests=python/tests
          # An engine package (#1189): its Python, tests, facts and probes.
          spark="engines/spark/|$tests/spark_session\.py$"
          snowflake="$src/sql/snowflake\.py$|$tests/test_sql_snowflake\.py$"
          # An engine package (#1189): its Python, tests, facts and probes.
          polars="engines/polars/|python/tools/sverify_dev/probe_polars\.py$"
          io="$src/io/|$tests/test_io_"
          pytests="$tests/"
          tools=python/tools/
          nbs='notebooks/'
          # sverify-dbt, a package of its own that only the `dbt` job reads.
          dbt='dbt/'
          # The pipeline template, which only the `template` job reads.
          template='templates/'
          # Each job and the areas it skips. Oracle A runs `sverify_dev.oracle`
          # on the lift and DuckDB (with Polars's evaluator, `slt`), no pytest;
          # the notebooks run sverify, neither tests nor `sverify_dev`.
          skip_spark="$polars|$snowflake|$io|$nbs|$dbt|$template"
          skip_polars="$spark|$nbs|$dbt|$template"
          skip_oracle="$spark|$snowflake|$io|$pytests|$nbs|$dbt|$template"
          skip_notebooks="$pytests|$tools|$dbt|$template"

          out ledger=false
          out backlog=false
          out upstack=false
          # The `test` matrix: the backends that run, `core` in three shards,
          # and `spark` in two when it runs (`$2`): one Spark job ran 9.5 to
          # 13.7 min against the 15-min timeout.
          matrix() {
            local shards='{"backends":"core","shard":"1/3"},{"backends":"core","shard":"2/3"},{"backends":"core","shard":"3/3"}'
            [ "$2" = true ] && shards="$shards"',{"backends":"spark","shard":"1/2"},{"backends":"spark","shard":"2/2"}'
            echo "{\"backends\":[$1],\"include\":[$shards]}"
          }
          all() {
            out code=true
            out floats=true
            out proofs=true
            out oracle=true
            out notebooks=true
            out dbt=true
            out dbtreplay=true
            out evidence=true
            out python=true
            out models=true
            out "matrix=$(matrix '"duckdb","polars snowflake"' true)"
          }
          # A push to main whose tree a pull request's run already tested.
          tested() {
            [ "$EVENT" = push ] || return 1
            git rev-parse -q --verify HEAD^2 >/dev/null || return 1
            git merge-base --is-ancestor HEAD^1 HEAD^2 || return 1
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ] || return 1
            if grep -qE '\.lean$|^(core/|analysis/|engines/)?(lakefile\.(lean|toml)|lake-manifest\.json|lean-toolchain)$' \
               <<< "$(git diff --name-only HEAD^1 HEAD)"; then
              return 1
            fi
            head=$(git rev-parse HEAD^2)
            n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" \
                --jq .total_count) || return 1
            [ "${n:-0}" -gt 0 ] || return 1
            echo "Tree already tested by a passing pull request run on $head: static only."
          }
          if [ "$EVENT" != pull_request ]; then
            if tested; then
              for o in code floats proofs oracle notebooks dbt dbtreplay evidence python models; do out "$o=false"; done
              out 'matrix={"backends":["duckdb"]}'
              exit 0
            fi
            all
            exit 0
          fi
          if [ "$BASE_REF" != main ] && [[ "$BASE_REF" != release/* ]]; then
            echo "Base is $BASE_REF: static only until the pull request targets main."
            out code=false
            out floats=false
            out upstack=true
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          # Here-strings, not pipes: under `pipefail` an early exit of `grep -q`
          # could fail the pipe.
          # A page test_readme.py runs: its `ROOT / "docs" / "x.md"` entry,
          # or a page of docs/theorems/, which it globs.
          runs_examples() {
            local f
            while read -r f; do
              case "$f" in
                docs/theorems/*.md) return 0 ;;
                *.md) grep -qF "ROOT / \"${f//\//\" / \"}\"" python/tests/test_readme.py && return 0 ;;
              esac
            done <<< "$files"
            return 1
          }
          if ! grep -qvE "$docs|$ledger" <<< "$files" && ! runs_examples; then
            out code=false
            if grep -qE "$ledger" <<< "$files"; then
              out ledger=true
            fi
            if grep -qx 'python/tests/lift_backlog\.json' <<< "$files"; then
              out backlog=true
            fi
          else
            out code=true
          fi
          # Whether a job reads any changed file: one outside the docs, the
          # ledgers and the areas it skips.
          reads() { grep -qvE "$docs|$ledger|^($1)" <<< "$files"; }
          flag() { if reads "$1"; then echo true; else echo false; fi; }
          if grep -qE '\.lean$|^(core/|analysis/|engines/)?(lakefile\.(lean|toml)|lake-manifest\.json|lean-toolchain)$|^scripts/lean(_timings\.py|-budget\.json)$|^scripts/checker_speed\.py$|^tests/checker-speed/' <<< "$files"; then
            out proofs=true
          else
            out proofs=false
          fi
          out "oracle=$(flag "$skip_oracle")"
          out "notebooks=$(flag "$skip_notebooks")"
          # A merge batch (`batch/*`) runs every gate; a pull request runs the
          # ones below only when a file they read changes.
          batch=false
          [[ "$HEAD_REF" == batch/* ]] && batch=true
          # The tests outside the repository (`outside-repo`) run the fast set
          # from a copy of the tests, as the wheel's test does; the `test`
          # jobs run the same tests from the source. A pull request runs it
          # for what can differ between the two: the packaging, the tests
          # (one may read a repository file) and the data files of the package.
          if [ "$batch" = true ] || grep -qE '^(python/(pyproject\.toml|uv\.lock|hatch_build\.py|scripts/wheel_tests\.sh|tests/|tools/)|python/src/.*\.(json|proto|md|toml|txt|ya?ml)$|engines/[^/]+/(pyproject\.toml$|tests/|src/)|\.github/workflows/ci\.yml$)' <<< "$files"; then
            out python=true
          else
            out python=false
          fi
          # The TLA+ models, which only `refresh-model` reads.
          if grep -qE '^(models/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            out models=true
          else
            out models=false
          fi
          # sverify-dbt reads sverify, and what the checker proves; the tour's
          # dbt notebook runs there too.
          if grep -qE '^(dbt/|notebooks/08_dbt\.py$|python/|SubstraitLean/|core/|analysis/|engines/|lakefile\.lean$|lake-manifest\.json$|lean-toolchain$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            out dbt=true
          else
            out dbt=false
          fi
          # The replay gates (they warn and never fail) on a pull request: when
          # a file they read changes, the Lean inputs included (`proofs`), and
          # always in a batch, on main and on release branches.
          lean='\.lean$|^(core/|analysis/|engines/)?(lakefile\.(lean|toml)|lake-manifest\.json|lean-toolchain)$'
          # Both replays call `verify`, so any change to the package's own
          # code can move them; its I/O, CLI, skills and schemas cannot.
          vsrc=$(grep -E '^python/src/sverify/' <<< "$files" | grep -vE '^python/src/sverify/(io|cli|skills|schemas)/' || true)
          engsrc=$(grep -E '^engines/[^/]+/src/' <<< "$files" || true)
          ibis_in="^(python/tools/sverify_dev/(ibis_replay|substrait_validator)\.py$|python/tests/(ibis_replay/|substrait_validator\.json$)|python/uv\.lock$|\.github/workflows/ci\.yml$)|$lean"
          dbt_in="^(dbt/|python/uv\.lock$|\.github/workflows/ci\.yml$)|$lean"
          gate() { [ "$batch" = true ] || [ -n "$vsrc" ] || [ -n "$engsrc" ] || grep -qE "$1" <<< "$files"; }
          out "evidence=$(gate "$ibis_in" && echo true || echo false)"
          out "dbtreplay=$(gate "$dbt_in" && echo true || echo false)"
          backends='"duckdb"'
          [ "$(flag "$skip_polars")" = true ] && backends="$backends,\"polars snowflake\""
          m=$(matrix "$backends" "$(flag "$skip_spark")")
          echo "matrix: $m"
          out "matrix=$m"
          # float-bounds' bridge imports the core's modules (`import Sverify.*`
          # in float-bounds/), and those import others: the closure of the
          # imports is what a change to must rebuild it, read from the
          # sources.
          float_deps() {
            local todo seen="" m f p
            todo=$(grep -rhoE '^((public|meta|private) )*import Sverify\.[A-Za-z0-9_.]+' float-bounds --include='*.lean' | awk '{print $NF}' | sort -u)
            while [ -n "$todo" ]; do
              m=${todo%%$'\n'*}
              case "$todo" in *$'\n'*) todo=${todo#*$'\n'} ;; *) todo= ;; esac
              case $'\n'"$seen"$'\n' in *$'\n'"$m"$'\n'*) continue ;; esac
              seen="$seen"$'\n'"$m"
              f=
              for p in core analysis; do [ -f "$p/${m//.//}.lean" ] && f="$p/${m//.//}.lean"; done
              [ -n "$f" ] || continue
              echo "$f"
              todo="$todo"$'\n'$(grep -hoE '^((public|meta|private) )*import Sverify\.[A-Za-z0-9_.]+' "$f" | awk '{print $NF}' || true)
            done
          }
          float_deps > "$RUNNER_TEMP/float-deps"
          echo "float-bounds reads $(wc -l < "$RUNNER_TEMP/float-deps") core files"
          if grep -qE '^(float-bounds/|core/(lakefile\.toml|lake-manifest\.json)$|lean-toolchain$|\.github/workflows/ci\.yml$|\.github/actions/setup-lean/)' <<< "$files" \
             || grep -qxFf "$RUNNER_TEMP/float-deps" <<< "$files"; then
            out floats=true
          else
            out floats=false
          fi

  # substrait-check, once per run, for every job that runs sverify. Its lake
  # build skips the generated proofs (`lean` checks them), so it restores the
  # lake cache without saving it: the cache keeps the checked build.
  checker:
    needs: [route, changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ledger == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    # `actions: read` for main's checker, the artifact of main's last run.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - id: cache
        uses: ./.github/actions/build-checker
      # The checker's speed against main's (docs/build-performance.md), on a
      # pull request that changes a Lean input: both answer the recorded
      # requests interleaved, and a request 1.3x as slow, or the set 1.1x,
      # fails. Main's checker is the artifact of the run on the merge's first
      # parent, or, without one, built here from main.
      - id: base
        if: needs.changes.outputs.proofs == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch -q --deepen=1 origin
          base=$(git rev-parse HEAD^1)
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$REPO/actions/artifacts?name=substrait-check&per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .workflow_run.head_sha == \"$base\") | .workflow_run.id" | head -1)
          if [ -n "$run" ] && gh run download "$run" -R "$REPO" -n substrait-check -D base-bin; then
            chmod +x base-bin/substrait-check
            echo "Main's checker: the substrait-check artifact of run $run ($base)"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main's checker: no artifact for $base; building it here"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.found == 'false' && steps.cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/setup-lean
        with:
          save: "false"
      - if: steps.base.outputs.found == 'false'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add -q /tmp/main "$BASE"
          for d in .lake core/.lake analysis/.lake frontend/.lake engines/.lake engines/polars/.lake engines/spark/.lake engines/duckdb/.lake engines/substrait/.lake; do
            if [ -d "$d" ]; then mkdir -p "/tmp/main/$(dirname "$d")" && cp -a "$d" "/tmp/main/$d"; fi
          done
          (cd /tmp/main && lake build substrait-check)
          mkdir -p base-bin
          cp /tmp/main/.lake/build/bin/substrait-check base-bin/
      - if: steps.base.outputs.found != ''
        name: Checker speed
        run: python3 scripts/checker_speed.py base-bin/substrait-check checker-bin/substrait-check

  # Every proof, the generated entries' included, when a Lean input changed.
  lean:
    needs: [route, changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proofs == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.heavy) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/setup-lean
      # The build budget (docs/build-performance.md): the builds below run
      # `lean` through a sysroot that records each module's CPU time and peak
      # RSS, and `check` warns on a module over its ceiling.
      - run: python3 scripts/lean_timings.py sysroot "$RUNNER_TEMP/lean-sysroot"
      # The layer guards (#1189, #1162): each package builds on the layers
      # below it alone. The core imports no analysis and no engine, the
      # analysis no engine, the frontend neither engines-common nor an engine,
      # engines-common no single engine, an engine's package (DuckDB,
      # Polars, Spark) no other engine. In the root
      # workspace such an import would resolve. The root build below reuses
      # each package's .lake.
      - run: lake build --wfail
        working-directory: core
        env: &lean-timings
          LAKE_OVERRIDE_LEAN: "true"
          LEAN_SYSROOT: ${{ runner.temp }}/lean-sysroot
          LEAN_TIMINGS: ${{ runner.temp }}/lean-timings.jsonl
      - run: lake build --wfail
        working-directory: analysis
        env: *lean-timings
      - run: lake build --wfail
        working-directory: frontend
        env: *lean-timings
      - run: lake build --wfail
        working-directory: engines
        env: *lean-timings
      - run: lake build --wfail
        working-directory: engines/polars
        env: *lean-timings
      - run: lake build --wfail
        working-directory: engines/spark
        env: *lean-timings
      - run: lake build --wfail
        working-directory: engines/duckdb
        env: *lean-timings
      - run: lake build --wfail
        working-directory: engines/substrait
        env: *lean-timings
      # The core, the analysis and engines-common are parametric in the
      # black-box catalogue: they declare no `Boxes.Ambient` instance. Only an
      # engine package does, as a `scoped instance` (#1189).
      - run: |
          if git grep -nE 'instance[^:]*:[^=]*Boxes\.Ambient' -- core analysis frontend engines/Sverify; then
            echo "a Boxes.Ambient instance in the core, the analysis, the frontend or engines-common" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # ARM (Hetzner) runs restore only (setup-lean says why).
          save-cache: ${{ runner.arch == 'X64' && 'auto' || 'false' }}
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      # Check every proof, the generated entries' included
      # (engines/Sverify/Engines/Generated.lean), warnings failing the build (what
      # `poe prove` runs, for every default target), before `uv run`'s
      # editable install builds substrait-check.
      - run: lake -R -Kcheck_generated=true build --wfail
        env: *lean-timings
      # Only the modules this run rebuilt are measured: the others restored
      # from the cache, unchanged with all they import.
      - name: Build budget
        run: |
          touch "$RUNNER_TEMP/lean-timings.jsonl"
          python3 scripts/lean_timings.py report --top 15 "$RUNNER_TEMP/lean-timings.jsonl" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/lean_timings.py check "$RUNNER_TEMP/lean-timings.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lean-timings
          path: ${{ runner.temp }}/lean-timings.jsonl
          retention-days: 14
          if-no-files-found: ignore
      - run: uv run --locked --project python poe -C python build
      - run: uv run --locked --project python poe -C python golden
      # The kernel-checked theorems' axioms, as docs/trusted-base.md lists them (#1088).
      - run: uv run --locked --project python python -m sverify_dev.trusted_base --check

  # The golden tests on the shared checker, when no Lean input changed.
  golden:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proofs != 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - run: tests/run.sh

  # Lint and typecheck need no Lean: they skip installing sverify itself (poe's
  # default executor would `uv run`, which installs it).
  static:

    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - run: uv sync --locked --project python --no-install-project
      - run: uv run --no-sync --project python poe -e simple -C python lint
      - run: uv run --no-sync --project python poe -e simple -C python typecheck

  # The backends of `tests/conftest.py`; the quick ones share a job, so they
  # pay for the setup once. `changes` leaves out the engines a pull request
  # cannot affect.
  test:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.backends }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      # `core` is split into three shards and `spark` into two (`SVERIFY_SHARD`,
      # tests/_suite.py) so that no job runs much longer than the others.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    # Spark stays on GitHub's runners for now: its runs were reclaimed twice on spot (#1737).
    runs-on: ${{ contains(matrix.backends, 'spark') && 'ubuntu-latest' || fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - env:
          BACKENDS: ${{ matrix.backends }}
          SVERIFY_SHARD: ${{ matrix.shard }}
          # The slowest tests, to see which to mark `slow` or what unbalances
          # the shards. Outside pull requests (main, merge queue, release
          # branches, a manual run), the coverage data of each shard for the
          # `coverage` job (#750); tracing costs 1 to 2.8 min per job, which a
          # pull request does not pay. `--cov-append` adds up the backends a
          # shard runs one after another.
          PYTEST_ADDOPTS: --durations=25${{ github.event_name != 'pull_request' && ' --cov --cov-append --cov-report=' || '' }}
          COVERAGE_FILE: ${{ github.workspace }}/cov/.coverage.${{ strategy.job-index }}
        run: |
          status=0
          for b in $BACKENDS; do
            uv run --locked --project python poe -C python "test-$b" || status=1
          done
          exit $status
      # The share of the 1.0 coverage targets covered (#743,
      # docs/coverage-targets.md), in the job summary; a gate from M6.
      - if: matrix.shard == '1/3'
        run: uv run --locked --project python python -m sverify_dev.coverage --targets >> "$GITHUB_STEP_SUMMARY"
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ strategy.job-index }}
          path: cov/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # The coverage of `sverify` over the shards of `test` (#750): combined, in the
  # job summary, outside pull requests (main, merge queue, release branches, a
  # manual run). It warns when lines and branches together fall under 89 % and never fails, and `qa` does not wait
  # for it.
  coverage:
    needs: [test]
    if: always() && needs.test.result != 'skipped' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: cov
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - working-directory: python
        run: |
          # The tests ran in this directory, so the relative paths line up.
          {
            uvx coverage combine ../cov/*/.coverage.* &&
              uvx coverage json -o coverage.json &&
              python3 scripts/coverage_summary.py coverage.json >> "$GITHUB_STEP_SUMMARY"
          } || echo "::warning::The coverage report failed; see the log."

  # A refresh's OpenLineage events against Marquez (#865): the job, its
  # datasets, the run and the contract facet through Marquez's API. One
  # container pair per run, so it runs outside pull requests (main, merge
  # queue, release branches, a manual run) and, like `coverage`, `qa` does
  # not wait for it.
  marquez:
    needs: [changes, checker]
    if: needs.changes.outputs.python == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          prune-cache: true
          cache-suffix: pruned
      - run: bash python/scripts/marquez.sh start | tee -a "$GITHUB_ENV"
      - working-directory: python
        env:
          SVERIFY_MARQUEZ_REQUIRED: "1"
        run: uv run --locked pytest tests/test_openlineage.py -k marquez -p no:cacheprovider
      - if: always()
        run: bash python/scripts/marquez.sh stop

  # The tests as the Wheels workflow runs them against the installed wheel:
  # from a copy outside the repository, with only the package's extras and
  # the test dependencies `python/scripts/wheel_tests.sh` lists, the fast
  # set. A test that reads repository files without `needs_repo`, or imports
  # a package the wheel test lacks, fails here, on its own pull request,
  # instead of in a release's Wheels run (0.5.0, 0.6.0).
  outside-repo:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.heavy) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          # ARM (Hetzner) runs restore only (setup-lean says why).
          save-cache: ${{ runner.arch == 'X64' && 'auto' || 'false' }}
          cache-dependency-glob: python/pyproject.toml
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - run: bash python/scripts/wheel_tests.sh --editable python --fast -n 4 --dist worksteal

  # sverify without DuckDB (#1288, #1485 item 16): the base install, no extra,
  # in an environment that has no `duckdb`. `verify` proves a plan and writes
  # SQL, every module imports, a run on DuckDB names the extra, and a Polars
  # connection puts, verifies and runs (#1764).
  no-duckdb:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml
          prune-cache: true
          cache-suffix: pruned
      - name: The base install has no DuckDB, and its tests pass
        run: |
          uv run --isolated --no-project --with-editable python --with-editable engines/duckdb \
            --with pytest python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("duckdb") is None, "duckdb is installed in the base"
          PY
          uv run --isolated --no-project --with-editable python --with-editable engines/duckdb \
            --with-editable engines/polars --with polars --with numpy \
            --with pytest --with hypothesis pytest -p no:cacheprovider python/tests/test_no_duckdb.py

  # Oracle A (#242): DuckDB runs the SQL, Lean evaluates the lift's plan, on
  # the benchmarks and on every sqllogictest file the ledgers decided a query
  # of; a query that no longer agrees, or newly disagrees, fails the job.
  oracle-a:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.oracle == 'true'
    name: oracle-a (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The files split two ways (`--shard`); the benchmarks run in the first.
        shard: [1/2, 2/2]
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      # DuckDB's test/sql at the version uv.lock pins (`slt.fetch`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/duckdb-slt
          key: duckdb-slt-${{ hashFiles('python/uv.lock') }}
      - run: uv run --locked --project python poe -C python oracle-a --shard ${{ matrix.shard }}
        env:
          # Name the file each worker starts, so a replay that hangs shows where.
          SVERIFY_SLT_PROGRESS: "1"

  notebooks:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.notebooks == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - run: uv run --locked --project python poe -C python notebooks

  # How long a check takes (#745, #825): every catalogue transform and the
  # tour's notebooks, cold and warm, by stage, in the job's summary and as
  # an artifact. Past a budget (`sverify_dev.bench.BUDGETS`) it fails.
  bench:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - working-directory: python
        run: uv run --locked python -m sverify_dev.bench --notebooks --budgets --json ../bench.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

  # The ledger class (see the header): the checkers of the facts and upstream
  # bugs, and the tests that read those files.
  ledger:
    needs: [route, changes, checker]
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      - working-directory: python
        run: |
          uv run --locked python -m sverify_dev.facts --strict
          uv run --locked python -m sverify_dev.bugs --stale  # warns on a thread unchecked for 90 days
      # test_functions checks the facts Lean's tables cite; test_probe and
      # test_probe_polars the probes' `probes.json`; test_polars_shims the
      # facts its shims cite and `areas.json`; test_substrait_cases the
      # ledger of Substrait's test cases and the ST entries it cites;
      # test_unexplained that every engine disagreement names its explanation.
      - working-directory: python
        run: >-
          uv run --locked pytest -n auto --dist worksteal
          tests/test_facts.py tests/test_bugs.py tests/test_functions.py
          tests/test_probe.py ../engines/polars/tests/test_probe_polars.py
          ../engines/polars/tests/test_polars_shims.py
          tests/test_substrait_cases.py ../engines/duckdb/tests/test_unexplained.py
      # A change to the lift's backlog changes how its tests report
      # (tests/conftest.py): run every test it lists before or after.
      - if: needs.changes.outputs.backlog == 'true'
        working-directory: python
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --locked python - <<'EOF'
          import json, os, subprocess, sys
          def ids(text):
              return {e["test"] for e in json.loads(text)["tests"]}
          path = "tests/lift_backlog.json"
          base = subprocess.run(["git", "show", f"{os.environ['BASE']}:python/{path}"],
                                capture_output=True, text=True, check=True).stdout
          tests = sorted(ids(base) | ids(open(path).read()))
          print("\n".join(tests), flush=True)
          sys.exit(subprocess.run([sys.executable, "-m", "pytest", "-n", "auto", *tests]).returncode)
          EOF

  # The outside-evidence gates (#867): sverify's outputs checked by tools
  # others wrote, each with a ledger of agree, refused and disagree. Gates
  # report and never block: a gate that finds a change from its ledger warns
  # here and in the run's summary, and `qa` does not wait on this job.
  #
  # Ibis's backend tests (#860): `sverify_dev.ibis_replay` runs them on
  # DuckDB with sverify as a plugin, and compares with the ledgers.
  #
  # substrait-validator (#862): no release reads the Substrait sverify
  # writes, so the job builds it at the commit `sverify_dev.substrait_validator`
  # pins (Rust, protoc 28.3 as its own CI uses), caches the wheel by that
  # commit, and runs it in a venv of its own: its protobuf bindings
  # (Substrait 0.88.1) cannot share a process with sverify's. The wheel
  # lives in the workspace: actions/cache stores a path outside it relative
  # to the workspace, so `~` saved on one runner kind was restored elsewhere on
  # another (GitHub's /home/runner, the AWS runners' /opt/actions-runner).
  evidence:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.evidence == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.heavy) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # ARM (Hetzner) runs restore only (setup-lean says why).
          save-cache: ${{ runner.arch == 'X64' && 'auto' || 'false' }}
          cache-dependency-glob: python/uv.lock
          prune-cache: true
          cache-suffix: pruned
      # The validator's build, pinned: its commit, the Rust toolchain, maturin
      # and protoc (28.3, as its own CI uses), all in the wheel's cache key.
      - id: validator
        env:
          ARCH: ${{ runner.arch }}
        run: |
          commit=$(sed -n 's/^COMMIT = "\([0-9a-f]*\)"$/\1/p' python/tools/sverify_dev/substrait_validator.py)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rust=1.96.1" >> "$GITHUB_OUTPUT"
          echo "maturin=1.16.0" >> "$GITHUB_OUTPUT"
          echo "protoc=28.3" >> "$GITHUB_OUTPUT"
          case "$ARCH" in
            ARM64) echo "protoc_arch=aarch_64" >> "$GITHUB_OUTPUT" ;;
            *) echo "protoc_arch=x86_64" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: substrait-validator-wheel
          key: substrait-validator-${{ steps.validator.outputs.commit }}-rust${{ steps.validator.outputs.rust }}-maturin${{ steps.validator.outputs.maturin }}-protoc${{ steps.validator.outputs.protoc }}-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}
      # A hit says only that the key matched: build whenever no wheel came.
      - id: wheel
        run: |
          if compgen -G 'substrait-validator-wheel/*.whl' > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.wheel.outputs.found != 'true'
        env:
          COMMIT: ${{ steps.validator.outputs.commit }}
          RUSTUP_TOOLCHAIN: ${{ steps.validator.outputs.rust }}
          PROTOC_VERSION: ${{ steps.validator.outputs.protoc }}
          PROTOC_ARCH: ${{ steps.validator.outputs.protoc_arch }}
          MATURIN: ${{ steps.validator.outputs.maturin }}
        run: |
          set -euo pipefail
          if command -v rustup; then
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          else
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          src=$RUNNER_TEMP/substrait-validator
          git init -q "$src" && cd "$src"
          git fetch -q --depth 1 https://github.com/substrait-io/substrait-validator.git "$COMMIT"
          git checkout -q FETCH_HEAD && git submodule update -q --init --depth 1
          curl -sSLo "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-$PROTOC_ARCH.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          PROTOC="$RUNNER_TEMP/protoc/bin/protoc" PROTOC_INCLUDE="$RUNNER_TEMP/protoc/include" \
            uvx "maturin==$MATURIN" build --release -m py/Cargo.toml -i python3.12 -o "$GITHUB_WORKSPACE/substrait-validator-wheel"
      - run: |
          uv venv -q -p 3.12 "$RUNNER_TEMP/validator"
          uv pip install -q -p "$RUNNER_TEMP/validator/bin/python" substrait-validator-wheel/*.whl
          echo "SUBSTRAIT_VALIDATOR_PYTHON=$RUNNER_TEMP/validator/bin/python" >> "$GITHUB_ENV"
      - working-directory: python
        run: uv sync --locked
      - name: substrait-validator (#862)
        working-directory: python
        run: |
          if ! uv run --no-sync python -m sverify_dev.substrait_validator --check > "$RUNNER_TEMP/gate.txt" 2>&1; then
            echo "::warning title=substrait-validator gate::the export's validation differs from python/tests/substrait_validator.json; see the step's log and the summary"
          fi
          cat "$RUNNER_TEMP/gate.txt"
          { echo '### substrait-validator (#862)'; echo '```'; cat "$RUNNER_TEMP/gate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Ibis's own backend tests on DuckDB (#860): the suite at the Ibis
      # release uv.lock pins and its test data (70 MB), cached by both pins.
      - id: ibis
        run: |
          f=python/tools/sverify_dev/ibis_replay.py
          echo "key=$(sed -n 's/^IBIS_TAG = "\(.*\)"$/\1/p' $f)-$(sed -n 's/^DATA_COMMIT = "\(.*\)"$/\1/p' $f)" >> "$GITHUB_OUTPUT"
      # 233 MB: an ARM (Hetzner) run restores it only (setup-lean says why).
      - if: runner.arch == 'X64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/ibis-replay
          key: ibis-replay-${{ steps.ibis.outputs.key }}-${{ runner.environment }}
      - if: runner.arch != 'X64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/ibis-replay
          key: ibis-replay-${{ steps.ibis.outputs.key }}-${{ runner.environment }}
      - name: Ibis's backend tests (#860)
        working-directory: python
        run: |
          if ! uv run --no-sync python -m sverify_dev.ibis_replay --check > "$RUNNER_TEMP/ibis.txt" 2>&1; then
            echo "::warning title=Ibis replay gate::outcomes differ from python/tests/ibis_replay/; see the step's log and the summary"
          fi
          cat "$RUNNER_TEMP/ibis.txt"
          { echo "### Ibis's backend tests (#860)"; echo '```'; cat "$RUNNER_TEMP/ibis.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # sverify-dbt (dbt/): lint, typecheck and tests, then its check of the
  # sample project, `dbt build` without the tests it proved, and `dbt test`
  # of those on the data.
  dbt:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dbt == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.heavy) }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read  # the replay's closed-issue check (`gh issue view`)
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # ARM (Hetzner) runs restore only (setup-lean says why).
          save-cache: ${{ runner.arch == 'X64' && 'auto' || 'false' }}
          cache-dependency-glob: dbt/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      # Not --locked: the lock holds this checkout's sverify, whose own
      # dependencies may change in a PR without relocking dbt/; uv keeps the
      # locked versions and re-resolves only what changed.
      - run: uv sync
      - run: |
          uv run --no-sync ruff check .
          # Text files name their encoding (PLW1514, a preview rule, alone), as
          # sverify's `poe lint` checks: Windows reads cp1252 otherwise (#183).
          uv run --no-sync ruff check --preview --select PLW1514 .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyrefly check
      # The sample project's packages once: the tests' copies of it take
      # them (tests/conftest.py), and the steps below too.
      - run: uv run --no-sync dbt --no-use-colors deps --project-dir examples/shop --profiles-dir examples/shop
      # The coverage of `sverify_dbt` (#750), as `sverify`'s: in the job
      # summary, a warning under 90 %, never a failure, and traced outside pull
      # requests only (tracing costs time).
      - if: github.event_name == 'pull_request'
        run: uv run --no-sync pytest -q
      - if: github.event_name != 'pull_request'
        run: |
          uv run --no-sync --with coverage coverage run --branch --source=sverify_dbt -m pytest -q
          uv run --no-sync --with coverage coverage json -o coverage.json
          python3 ../python/scripts/coverage_summary.py coverage.json --package sverify_dbt --target 90 >> "$GITHUB_STEP_SUMMARY"
      - env:
          DBT: uv run --no-sync dbt --no-use-colors
          SHOP: --project-dir examples/shop --profiles-dir examples/shop
        run: |
          $DBT compile $SHOP
          uv run --no-sync sverify-dbt check examples/shop --selectors
          $DBT seed $SHOP
          $DBT build $SHOP --exclude selector:sverify_proved
          $DBT test $SHOP --select selector:sverify_proved
      # dbt packages' integration projects (#859): built with dbt on DuckDB
      # and checked with sverify-dbt, against the ledgers in dbt/replay/.
      # A gate: it reports a change as a warning and never fails the job.
      - if: needs.changes.outputs.dbtreplay == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/dbt-replay
          key: dbt-replay-${{ hashFiles('dbt/src/sverify_dbt/replay.py') }}
      - name: dbt packages' integration projects (#859)
        if: needs.changes.outputs.dbtreplay == 'true'
        env:
          DO_NOT_TRACK: "1"
          GH_TOKEN: ${{ github.token }}  # the closed-issue check asks `gh`
        run: |
          if ! uv run --no-sync python -m sverify_dbt.replay --check > "$RUNNER_TEMP/replay.txt" 2>&1; then
            echo "::warning title=dbt replay gate::the replay check found something (an outcome that differs from dbt/replay/, or an entry on a closed issue); see the step's log and the summary"
          fi
          cat "$RUNNER_TEMP/replay.txt"
          { echo "### dbt packages' integration projects (#859)"; echo '```'; cat "$RUNNER_TEMP/replay.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The tour's dbt notebook (`poe notebooks` skips it: the python/
      # environment has no dbt).
      - env:
          DO_NOT_TRACK: "1"  # dbt's usage tracking can stall without network
        run: uv run --no-sync --with marimo marimo export html ../notebooks/08_dbt.py -o "$RUNNER_TEMP/08_dbt.html"

  # The pipeline template (templates/pipelines/, #771), as a repository of
  # its own: its tests run its workflows' steps (check, refresh twice, the
  # catalog, a refresh the data refuses) on the recorded Eurostat response
  # with this checkout's sverify; a warning flags skills that differ from
  # the package's, and actionlint checks its workflows.
  template:
    needs: [route, changes, checker]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          # The cache keeps the wheels uv built, and the rest come from PyPI:
          # 9-12 s for setup and sync against 19-26 s with every wheel cached.
          prune-cache: true
          cache-suffix: pruned
      # actionlint is the release's binary, checked against the release's
      # checksum and cached: a Docker Hub pull failed a merge batch (#2090).
      # The path is under the workspace, so a cache saved on another runner
      # restores to the same place.
      - id: actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .actionlint
          key: actionlint-1.7.7-${{ runner.os }}-${{ runner.arch }}
      - if: steps.actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: 1.7.7
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 sum=401942f9c24ed71e4fe71b76c7d638f66d8633575c4016efd2977ce7c28317d0 ;;
            *) arch=amd64 sum=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 ;;
          esac
          tgz="$RUNNER_TEMP/actionlint_${VERSION}_linux_$arch.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_$arch.tar.gz"
          echo "$sum  $tgz" | sha256sum -c -
          mkdir -p .actionlint
          tar -xzf "$tgz" -C .actionlint actionlint
      - run: |
          actionlint="$PWD/.actionlint/actionlint"
          repo=$(mktemp -d)
          cp -R templates/pipelines/. "$repo/"
          git -C "$repo" init --quiet -b main
          git -C "$repo" add -A
          git -C "$repo" -c user.name=ci -c user.email=ci@localhost commit --quiet -m "Use this template"
          py="$PWD/python"
          cd "$repo"
          # A PR that changes a skill shouldn't have to edit the template's
          # copy too: warn, and test with the package's skills.
          uv run --locked --project "$py" python scripts/sync-skills.py --check \
            || { echo "::warning::templates/pipelines/.claude/skills differ from the package's; run scripts/sync-skills.py there"; \
                 uv run --locked --project "$py" python scripts/sync-skills.py; }
          uv run --locked --project "$py" ruff check .
          uv run --locked --project "$py" ruff format --check .
          uv run --locked --project "$py" python -m pytest -q -p no:cacheprovider
          # actionlint reads the workflows of the git repository it runs in.
          "$actionlint" -color

  # Float error bounds (docs/float-bounds.md): a separate Lake package that
  # needs Mathlib, fetched as prebuilt oleans.
  float-bounds:
    needs: changes
    if: needs.changes.outputs.floats == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      # The package's own build, by its sources: unchanged, `lake build` only
      # checks the traces (Mathlib comes from `lake exe cache get` each time).
      # Lake rebuilds every module whose inputs differ, so a restored build of
      # other sources (the restore key) is safe too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: float-bounds/.lake/build
          key: float-bounds-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('float-bounds/lean-toolchain', 'float-bounds/lake-manifest.json', 'float-bounds/lakefile.toml', 'float-bounds/**/*.lean') }}
          restore-keys: float-bounds-${{ runner.os }}-${{ runner.arch }}-
      - working-directory: float-bounds
        run: lake exe cache get && lake build --wfail

  # The refresh protocol's TLA+ model (models/refresh/README.md): TLC checks
  # every config against what its first line expects, when the model changes.
  # The runner's Java runs the pinned tla2tools.jar.
  refresh-model:
    needs: changes
    if: needs.changes.outputs.models == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c
      - run: bash models/refresh/check.sh
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          TLC_WORKERS: "4"
          TLC_HEAP: 6g

  # The check the `main` ruleset requires: green only if every job above
  # passed or was skipped by `changes`. A job skipped for any other reason
  # follows a failed `changes` or `checker`, which this catches. A pull request
  # into another branch fails it (see the header).
  qa:
    needs: [changes, checker, lean, golden, static, test, outside-repo, no-duckdb, notebooks, bench, dbt, template, float-bounds, oracle-a, ledger, refresh-model]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - if: needs.changes.outputs.upstack == 'true'
        run: |
          echo "::error::The base is not main: only static ran. The full matrix runs when the pull request is retargeted to main."
          exit 1
