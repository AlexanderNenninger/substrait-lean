name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each group of queued PRs on top of main, so PRs
  # need not be up to date with main themselves.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `poe qa`, split into jobs that run side by side. Every job that installs
# sverify builds substrait-check (the editable install's build hook runs lake),
# from the shared lake cache when the Lean sources have not changed.
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python prove
      - run: uv run --locked --project python poe -C python build
      - run: uv run --locked --project python poe -C python golden

  # Lint and typecheck need no Lean: they skip installing sverify itself (poe's
  # default executor would `uv run`, which installs it).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked --project python --no-install-project
      - run: uv run --no-sync --project python poe -e simple -C python lint
      - run: uv run --no-sync --project python poe -e simple -C python typecheck

  # One job per backend of `tests/conftest.py`.
  test:
    strategy:
      fail-fast: false
      matrix:
        backend: [core, datafusion, duckdb, polars, snowflake, spark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python test-${{ matrix.backend }}

  # Isthmus as the SQL producer: its tests, and every SQL string the suite
  # compiles, compiled by Isthmus too and compared with DataFusion's plan.
  isthmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # Pinned by version and SHA-256 in the script.
      - run: echo "SVERIFY_ISTHMUS=$(python/scripts/fetch_isthmus.sh "$RUNNER_TEMP/isthmus")" >> "$GITHUB_ENV"
      - run: uv run --locked --project python poe -C python test-isthmus
      - run: uv run --locked --project python poe -C python compare-sql

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python notebooks

  # The check the `main` ruleset requires: green only if every job above is.
  qa:
    needs: [lean, static, test, isthmus, notebooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
