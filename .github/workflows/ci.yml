name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `poe qa`, split into jobs that run side by side. Every job that installs
# sverify builds substrait-check (the editable install's build hook runs lake),
# from the shared lake cache when the Lean sources have not changed.
#
# A pull request that changes only docs (`docs/`, `.claude/`, Markdown at the
# root other than README.md, which tests run) skips everything but `static`,
# and float-bounds runs only when its own package changes. A push to main
# always runs everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      floats: ${{ steps.diff.outputs.floats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "floats=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          # Here-strings, not pipes: under `pipefail` an early exit of `grep -q`
          # could fail the pipe.
          if grep -qvE '^(docs/|\.claude/|[^/]+\.md$)' <<< "$files" \
             || grep -qx 'README\.md' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(float-bounds/|lean-toolchain$|\.github/workflows/ci\.yml$|\.github/actions/setup-lean/)' \
             <<< "$files"; then
            echo "floats=true" >> "$GITHUB_OUTPUT"
          else
            echo "floats=false" >> "$GITHUB_OUTPUT"
          fi

  lean:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python prove
      - run: uv run --locked --project python poe -C python build
      - run: uv run --locked --project python poe -C python golden

  # Lint and typecheck need no Lean: they skip installing sverify itself (poe's
  # default executor would `uv run`, which installs it).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked --project python --no-install-project
      - run: uv run --no-sync --project python poe -e simple -C python lint
      - run: uv run --no-sync --project python poe -e simple -C python typecheck

  # The backends of `tests/conftest.py`; the quick ones share a job, so they
  # pay for the setup once.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        backends: [core, duckdb, spark, datafusion polars snowflake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - env:
          BACKENDS: ${{ matrix.backends }}
        run: |
          status=0
          for b in $BACKENDS; do
            uv run --locked --project python poe -C python "test-$b" || status=1
          done
          exit $status

  # Isthmus as the SQL producer: its tests, and every SQL string the suite
  # compiles, compiled by Isthmus too and compared with DataFusion's plan.
  isthmus:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # Pinned by version and SHA-256 in the script.
      - run: echo "SVERIFY_ISTHMUS=$(python/scripts/fetch_isthmus.sh "$RUNNER_TEMP/isthmus")" >> "$GITHUB_ENV"
      - run: uv run --locked --project python poe -C python test-isthmus
      - run: uv run --locked --project python poe -C python compare-sql

  notebooks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python notebooks

  # Float error bounds (docs/float-bounds.md): a separate Lake package that
  # needs Mathlib, fetched as prebuilt oleans.
  float-bounds:
    needs: changes
    if: needs.changes.outputs.floats == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - working-directory: float-bounds
        run: lake exe cache get && lake build --wfail

  # The check the `main` ruleset requires: green only if every job above
  # passed or was skipped by `changes`. A job skipped for any other reason
  # follows a failed `changes`, which this catches.
  qa:
    needs: [changes, lean, static, test, isthmus, notebooks, float-bounds]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
