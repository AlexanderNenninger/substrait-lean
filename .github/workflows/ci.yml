name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # `retarget.yml` starts a run when a pull request is retargeted to main.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request whose merge with main to test (empty for the branch itself)
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `poe qa`, split into jobs that run side by side. A push to main, a merge
# queue entry and a run `retarget.yml` starts run everything; the rules below
# apply to pull requests, and `changes` decides them.
#
# `checker` builds substrait-check once per run (cached by a hash of the Lean
# sources, the lakefile and the toolchain) and every job that runs sverify
# downloads it (`.github/actions/checker`), so their editable installs link it
# without running lake.
#
# `lean` checks every proof, the generated entries' included
# (`-Kcheck_generated=true`), when a `.lean` file, the lakefile, the manifest
# or the toolchain changes (the generators and `Profile.duckdb` are `.lean`
# files). Otherwise no proof can change, and `golden` runs the golden tests on
# the shared checker.
#
# A pull request that changes only docs (`docs/`, `.claude/`, `changelog.d/`,
# Markdown at the root other than README.md, which tests run, and
# docs/guide.md and docs/how-it-works.md, which tests run too) skips
# everything but `static`, and float-bounds runs only when its own package
# changes.
#
# A pull request that changes only the ledgers (the facts of
# `characterization/<engine>/facts/`, `characterization/*.json`, the probes'
# `probes.json`, Markdown, `upstream/`, `python/tests/lift_backlog.json`,
# plus docs) runs `static` and `ledger`: the checkers of those records and the
# tests that read them. The replay ledgers `characterization/duckdb/<area>.json`
# and `characterization/oracle-a/` feed oracle A, so they run everything.
#
# The other pull requests run `test (core)` and `test (duckdb)` always, and
# skip a job when every file they change is one the job cannot read: the
# table of areas in `changes` lists, for each job, the areas it skips. A file
# outside every area (shared translation code, the lift, the SQL writer, Lean,
# the dependencies, CI) runs every job.
#
# A pull request into a branch other than main (a stacked one) runs `static`
# only, and `qa` fails, saying so: a green `qa` would stay on the commit after
# the retarget to main, while the full run that replaces it is still going.
# When the pull request is retargeted to main, `retarget.yml` starts this
# workflow on it (`workflow_dispatch`), which runs everything on its merge
# with main.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      floats: ${{ steps.diff.outputs.floats }}
      ledger: ${{ steps.diff.outputs.ledger }}
      backlog: ${{ steps.diff.outputs.backlog }}
      upstack: ${{ steps.diff.outputs.upstack }}
      proofs: ${{ steps.diff.outputs.proofs }}
      oracle: ${{ steps.diff.outputs.oracle }}
      notebooks: ${{ steps.diff.outputs.notebooks }}
      dbt: ${{ steps.diff.outputs.dbt }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          docs='^(docs/|\.claude/|changelog\.d/|[^/]+\.md$)'
          ledger='^(upstream/|characterization/([^/]+\.json$|[^/]+/facts/|[^/]+/probes\.json$|.*\.md$)|python/tests/lift_backlog\.json$)'

          # The areas: files that only one job, or no job but `test (core)`
          # and `test (duckdb)`, can read.
          src=python/src/sverify
          tests=python/tests
          spark="$src/(spark_engine|sql/spark)\.py$|$tests/(spark_session|test_sql_spark)\.py$"
          snowflake="$src/sql/snowflake\.py$|$tests/test_sql_snowflake\.py$"
          polars="$src/(polars_engine|_polars_shims)\.py$|$tests/test_(polars|polars_shims|probe_polars)\.py$|python/tools/sverify_dev/probe_polars\.py$"
          datafusion="$tests/test_datafusion_quirks\.py$"
          io="$src/io/|$tests/test_io_"
          pytests="$tests/"
          tools=python/tools/
          nbs='notebooks/'
          # sverify-dbt, a package of its own that only the `dbt` job reads.
          dbt='dbt/'
          # The pipeline template, which only the `template` job reads.
          template='templates/'
          # Each job and the areas it skips. Oracle A runs `sverify_dev.oracle`
          # on the lift and DuckDB (with Polars's evaluator, `slt`), no pytest;
          # the notebooks run sverify, neither tests nor `sverify_dev`.
          skip_spark="$polars|$snowflake|$datafusion|$io|$nbs|$dbt|$template"
          skip_polars="$spark|$datafusion|$nbs|$dbt|$template"
          skip_datafusion="$spark|$snowflake|$nbs|$dbt|$template"
          skip_oracle="$spark|$snowflake|$datafusion|$io|$pytests|$nbs|$dbt|$template"
          skip_notebooks="$pytests|$tools|$dbt|$template"

          out ledger=false
          out backlog=false
          out upstack=false
          all() {
            out code=true
            out floats=true
            out proofs=true
            out oracle=true
            out notebooks=true
            out dbt=true
            out 'matrix={"backends":["duckdb","spark","datafusion","polars snowflake"],"include":[{"backends":"core","shard":"1/3"},{"backends":"core","shard":"2/3"},{"backends":"core","shard":"3/3"}]}'
          }
          if [ "$EVENT" != pull_request ]; then
            all
            exit 0
          fi
          if [ "$BASE_REF" != main ]; then
            echo "Base is $BASE_REF: static only until the pull request targets main."
            out code=false
            out floats=false
            out upstack=true
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$files"
          # Here-strings, not pipes: under `pipefail` an early exit of `grep -q`
          # could fail the pipe.
          if ! grep -qvE "$docs|$ledger" <<< "$files" \
             && ! grep -qxE 'README\.md|docs/(guide|how-it-works)\.md' <<< "$files"; then
            out code=false
            if grep -qE "$ledger" <<< "$files"; then
              out ledger=true
            fi
            if grep -qx 'python/tests/lift_backlog\.json' <<< "$files"; then
              out backlog=true
            fi
          else
            out code=true
          fi
          # Whether a job reads any changed file: one outside the docs, the
          # ledgers and the areas it skips.
          reads() { grep -qvE "$docs|$ledger|^($1)" <<< "$files"; }
          flag() { if reads "$1"; then echo true; else echo false; fi; }
          if grep -qE '\.lean$|^(lakefile\.lean|lake-manifest\.json|lean-toolchain)$' <<< "$files"; then
            out proofs=true
          else
            out proofs=false
          fi
          out "oracle=$(flag "$skip_oracle")"
          out "notebooks=$(flag "$skip_notebooks")"
          # sverify-dbt reads sverify, and what the checker proves.
          if grep -qE '^(dbt/|python/|SubstraitLean/|lakefile\.lean$|lake-manifest\.json$|lean-toolchain$|\.github/workflows/ci\.yml$)' <<< "$files"; then
            out dbt=true
          else
            out dbt=false
          fi
          backends='"duckdb"'
          [ "$(flag "$skip_spark")" = true ] && backends="$backends,\"spark\""
          [ "$(flag "$skip_datafusion")" = true ] && backends="$backends,\"datafusion\""
          [ "$(flag "$skip_polars")" = true ] && backends="$backends,\"polars snowflake\""
          matrix="{\"backends\":[$backends],\"include\":[{\"backends\":\"core\",\"shard\":\"1/3\"},{\"backends\":\"core\",\"shard\":\"2/3\"},{\"backends\":\"core\",\"shard\":\"3/3\"}]}"
          echo "matrix: $matrix"
          out "matrix=$matrix"
          if grep -qE '^(float-bounds/|lean-toolchain$|\.github/workflows/ci\.yml$|\.github/actions/setup-lean/)' \
             <<< "$files"; then
            out floats=true
          else
            out floats=false
          fi

  # substrait-check, once per run, for every job that runs sverify. Its lake
  # build skips the generated proofs (`lean` checks them), so it restores the
  # lake cache without saving it: the cache keeps the checked build.
  checker:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checker-bin
          key: substrait-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '**/*.lean') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-lean
        with:
          save: "false"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          lake build substrait-check
          mkdir -p checker-bin
          cp .lake/build/bin/substrait-check checker-bin/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: substrait-check
          path: checker-bin/substrait-check
          retention-days: 3
          if-no-files-found: error

  # Every proof, the generated entries' included, when a Lean input changed.
  lean:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # Check every generated entry's proof (SubstraitLean/Generated.lean),
      # before `uv run`'s editable install builds substrait-check.
      - run: lake -R -Kcheck_generated=true build
      - run: uv run --locked --project python poe -C python prove
      - run: uv run --locked --project python poe -C python build
      - run: uv run --locked --project python poe -C python golden

  # The golden tests on the shared checker, when no Lean input changed.
  golden:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.proofs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - run: tests/run.sh

  # Lint and typecheck need no Lean: they skip installing sverify itself (poe's
  # default executor would `uv run`, which installs it).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked --project python --no-install-project
      - run: uv run --no-sync --project python poe -e simple -C python lint
      - run: uv run --no-sync --project python poe -e simple -C python typecheck

  # The backends of `tests/conftest.py`; the quick ones share a job, so they
  # pay for the setup once. `changes` leaves out the engines a pull request
  # cannot affect.
  test:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.backends }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      # `core` is split into three shards (`SVERIFY_SHARD`, tests/conftest.py)
      # so that no job runs much longer than the others.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - env:
          BACKENDS: ${{ matrix.backends }}
          SVERIFY_SHARD: ${{ matrix.shard }}
          # The slowest tests, to see which to mark `slow` or what unbalances
          # the shards.
          PYTEST_ADDOPTS: --durations=25
        run: |
          status=0
          for b in $BACKENDS; do
            uv run --locked --project python poe -C python "test-$b" || status=1
          done
          exit $status
      # The share of the 1.0 coverage targets covered (#743,
      # docs/coverage-targets.md), in the job summary; a gate from M6.
      - if: matrix.shard == '1/3'
        run: uv run --locked --project python python -m sverify_dev.coverage --targets >> "$GITHUB_STEP_SUMMARY"

  # Oracle A (#242): DuckDB runs the SQL, Lean evaluates the lift's plan, on
  # the benchmarks and on every sqllogictest file the ledgers decided a query
  # of; a query that no longer agrees, or newly disagrees, fails the job.
  oracle-a:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.oracle == 'true'
    name: oracle-a (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # The files split four ways (`--shard`); the benchmarks run in the first.
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # DuckDB's test/sql at the version uv.lock pins (`slt.fetch`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/duckdb-slt
          key: duckdb-slt-${{ hashFiles('python/uv.lock') }}
      - run: uv run --locked --project python poe -C python oracle-a --shard ${{ matrix.shard }}
        env:
          # Name the file each worker starts, so a replay that hangs shows where.
          SVERIFY_SLT_PROGRESS: "1"

  notebooks:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.notebooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv run --locked --project python poe -C python notebooks

  # How long a check takes (#745, #825): every catalogue transform and the
  # tour's notebooks, cold and warm, by stage, in the job's summary and as
  # an artifact. Past a budget (`sverify_dev.bench.BUDGETS`) it fails.
  bench:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - working-directory: python
        run: uv run --locked python -m sverify_dev.bench --notebooks --budgets --json ../bench.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

  # The ledger class (see the header): the checkers of the facts and upstream
  # bugs, and the tests that read those files.
  ledger:
    needs: [changes, checker]
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - working-directory: python
        run: |
          uv run --locked python -m sverify_dev.facts
          uv run --locked python -m sverify_dev.bugs
      # test_functions checks the facts Lean's tables cite; test_probe and
      # test_probe_polars the probes' `probes.json`; test_polars_shims the
      # facts its shims cite and `areas.json`; test_substrait_cases the
      # ledger of Substrait's test cases and the ST entries it cites.
      - working-directory: python
        run: >-
          uv run --locked pytest -n auto --dist worksteal
          tests/test_facts.py tests/test_bugs.py tests/test_functions.py
          tests/test_probe.py tests/test_probe_polars.py tests/test_polars_shims.py
          tests/test_substrait_cases.py
      # A change to the lift's backlog changes how its tests report
      # (tests/conftest.py): run every test it lists before or after.
      - if: needs.changes.outputs.backlog == 'true'
        working-directory: python
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --locked python - <<'EOF'
          import json, os, subprocess, sys
          def ids(text):
              return {e["test"] for e in json.loads(text)["tests"]}
          path = "tests/lift_backlog.json"
          base = subprocess.run(["git", "show", f"{os.environ['BASE']}:python/{path}"],
                                capture_output=True, text=True, check=True).stdout
          tests = sorted(ids(base) | ids(open(path).read()))
          print("\n".join(tests), flush=True)
          sys.exit(subprocess.run([sys.executable, "-m", "pytest", "-n", "auto", *tests]).returncode)
          EOF

  # sverify-dbt (dbt/): lint, typecheck and tests, then its check of the
  # sample project, `dbt build` without the tests it proved, and `dbt test`
  # of those on the data.
  dbt:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: dbt/uv.lock
      # Not --locked: the lock holds this checkout's sverify, whose own
      # dependencies may change in a PR without relocking dbt/; uv keeps the
      # locked versions and re-resolves only what changed.
      - run: uv sync
      - run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyrefly check
      - run: uv run --no-sync pytest -q
      - env:
          DBT: uv run --no-sync dbt --no-use-colors
          SHOP: --project-dir examples/shop --profiles-dir examples/shop
        run: |
          $DBT deps $SHOP
          $DBT compile $SHOP
          uv run --no-sync sverify-dbt check examples/shop --selectors
          $DBT seed $SHOP
          $DBT build $SHOP --exclude selector:sverify_proved
          $DBT test $SHOP --select selector:sverify_proved

  # The pipeline template (templates/pipelines/, #771), as a repository of
  # its own: its tests run its workflows' steps (check, refresh twice, the
  # catalog, a refresh the data refuses) on the recorded Eurostat response
  # with this checkout's sverify; a warning flags skills that differ from
  # the package's, and actionlint checks its workflows.
  template:
    needs: [changes, checker]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: |
          repo=$(mktemp -d)
          cp -R templates/pipelines/. "$repo/"
          git -C "$repo" init --quiet -b main
          git -C "$repo" add -A
          git -C "$repo" -c user.name=ci -c user.email=ci@localhost commit --quiet -m "Use this template"
          py="$PWD/python"
          cd "$repo"
          # A PR that changes a skill shouldn't have to edit the template's
          # copy too: warn, and test with the package's skills.
          uv run --locked --project "$py" python scripts/sync-skills.py --check \
            || { echo "::warning::templates/pipelines/.claude/skills differ from the package's; run scripts/sync-skills.py there"; \
                 uv run --locked --project "$py" python scripts/sync-skills.py; }
          uv run --locked --project "$py" ruff check .
          uv run --locked --project "$py" ruff format --check .
          uv run --locked --project "$py" python -m pytest -q -p no:cacheprovider
          # actionlint reads the workflows of the git repository it runs in;
          # as the owner of the files, or git refuses the repository.
          docker run --rm --user "$(id -u):$(id -g)" -v "$repo:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Float error bounds (docs/float-bounds.md): a separate Lake package that
  # needs Mathlib, fetched as prebuilt oleans.
  float-bounds:
    needs: changes
    if: needs.changes.outputs.floats == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - working-directory: float-bounds
        run: lake exe cache get && lake build --wfail

  # The check the `main` ruleset requires: green only if every job above
  # passed or was skipped by `changes`. A job skipped for any other reason
  # follows a failed `changes` or `checker`, which this catches. A pull request
  # into another branch fails it (see the header).
  qa:
    needs: [changes, checker, lean, golden, static, test, notebooks, bench, dbt, template, float-bounds, oracle-a, ledger]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - if: needs.changes.outputs.upstack == 'true'
        run: |
          echo "::error::The base is not main: only static ran. The full matrix runs when the pull request is retargeted to main."
          exit 1
