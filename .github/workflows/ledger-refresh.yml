# TEMPORARY: refreshes the replay ledgers of the areas oracle A changed (#407). Removed before merge.
name: ledger-refresh
on:
  push:
    branches: [claude/oracle-skips-a9ed3c]
permissions:
  contents: read
jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        areas:
          - optimizer
          - order overflow parallelism
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sverify/duckdb-slt
          key: duckdb-slt-${{ hashFiles('python/uv.lock') }}
      - env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd python
          uv run --locked python -m sverify_dev.slt --jobs 3 ${{ matrix.areas }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ledgers-${{ strategy.job-index }}
          path: characterization/duckdb/
