# TEMPORARY: measures cold builds before and after check_generated. Removed before merge.
name: build-measure
on:
  push:
    branches: [claude/build-simplify-a9ed3c]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        variant: [main, quick, checked]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'main' && 'main' || github.sha }}
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - name: cold lake build
        run: |
          rm -rf .lake
          case "${{ matrix.variant }}" in
            main) args="build" ;;
            quick) args="-R build" ;;
            checked) args="-R -Kcheck_generated=true build" ;;
          esac
          /usr/bin/time -v lake $args 2>&1 | grep -E "Elapsed|Maximum resident|error|Build completed|Built SubstraitLean\.(Lift|Lowering)DuckDB\.[A-Za-z]+\.[A-Za-z]+ \(" | cut -c1-200
