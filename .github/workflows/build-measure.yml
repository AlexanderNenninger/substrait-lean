# TEMPORARY: measures cold builds before and after check_generated, on one runner. Removed before merge.
name: build-measure
on:
  push:
    branches: [claude/build-simplify-a9ed3c]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lean
        with:
          cache: "false"
      - name: cold builds
        run: |
          measure() {
            rm -rf .lake
            echo "== $1"
            /usr/bin/time -v lake $2 > /tmp/out 2>&1 || echo "FAILED"
            grep -E "Elapsed|Maximum resident|error" /tmp/out | cut -c1-200
            grep -oE "Built SubstraitLean[A-Za-z.]* \([0-9.]+m?s\)" /tmp/out | grep -v "ms)" | sort -t'(' -k2 -rn | head -6
          }
          sha=$(git rev-parse HEAD)
          git checkout -q origin/main; measure main "build"
          git checkout -q $sha; measure quick "-R build"
          measure checked "-R -Kcheck_generated=true build"
          git checkout -q origin/main; measure main-again "build"
