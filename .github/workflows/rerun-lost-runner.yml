name: Rerun lost runner

# The AWS runners are spot instances: AWS can reclaim one mid-job, and GitHub
# then fails the job with "The runner has received a shutdown signal" or "lost
# communication". When a CI run of this repository's own pull request fails
# and one of its failed jobs says so in its annotations, this reruns the
# failed jobs once (attempt 1 only), so a reclaimed runner does not turn `qa`
# red. Any other failure is left alone. Batch branches, pushes and the merge
# queue run on GitHub's runners and never match.
#
# A `workflow_run` workflow runs from the default branch, so this takes effect
# once it is merged to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          lost=0
          for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[].message' \
                | grep -qiE 'received a shutdown signal|lost communication with the server|runner .* (has been )?(terminated|removed)'; then
              echo "Job $job lost its runner."
              lost=1
            fi
          done
          if [ "$lost" = 1 ]; then
            gh run rerun "$RUN" --failed
          else
            echo "No failed job lost its runner: left alone."
          fi
