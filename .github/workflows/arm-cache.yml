name: ARM caches

# Warms, on main, the caches the ARM64 Hetzner runners need (ci.yml's header):
# the lake build and the ARM substrait-check. A pull request's run restores
# caches of its own ref and of main only, and main's CI never runs on ARM, so
# without this every pull request would build all of Lean on ARM from
# scratch. Nothing waits for this workflow: when no Hetzner runner is free it
# queues, and a newer push to main cancels it.
on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - lean-toolchain
      - "**/lakefile.*"
      - "**/lake-manifest.json"
      - .github/actions/**
      - .github/workflows/arm-cache.yml
  workflow_dispatch:

concurrency:
  group: arm-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    if: vars.HETZNER_RUNNERS == 'on'
    runs-on: [self-hosted, linux, ARM64, hetzner]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # First the checker (its own cache; on a miss it restores the lake
      # cache and builds it), then the lake cache that `lean` restores: its
      # restore replaces .lake, and the builds below are those of `lean`.
      - uses: ./.github/actions/build-checker
        with:
          upload: "false"
      - uses: ./.github/actions/setup-lean
      - run: |
          for d in core analysis frontend engines engines/polars engines/spark engines/duckdb engines/substrait; do
            (cd "$d" && lake build)
          done
          lake -R -Kcheck_generated=true build
