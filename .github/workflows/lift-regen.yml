# Temporary (#lift check-only): regenerate the lift in CI and measure peak RSS,
# while homelab is unavailable. Removed before the PR merges.
name: lift-regen
on:
  push:
    branches: [claude/lift-checkonly-a9ed3c]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: ./.github/actions/setup-lean
      - run: lake build SubstraitLean.LiftSearch SubstraitLean.LiftCache
      # The shared Lake cache may hold it built: build it afresh.
      - run: rm -rf .lake/build/lib/lean/SubstraitLean/LiftDuckDB.* .lake/build/ir/SubstraitLean/LiftDuckDB.*
      - run: /usr/bin/time -v lake build SubstraitLean.LiftDuckDB 2>&1 | grep -E "Elapsed|Maximum resident|Built SubstraitLean.LiftDuckDB|error"
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - run: lake build SubstraitLean.LiftSearch SubstraitLean.LiftCache
      - run: /usr/bin/time -v lake env lean scripts/RegenLift.lean 2>&1 | grep -E "Elapsed|Maximum resident|wrote|error" | cut -c1-400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lift-generated
          path: SubstraitLean/LiftDuckDB/
      # The shared Lake cache may hold it built: build it afresh.
      - run: rm -rf .lake/build/lib/lean/SubstraitLean/LiftDuckDB.* .lake/build/ir/SubstraitLean/LiftDuckDB.*
      - run: /usr/bin/time -v lake build SubstraitLean.LiftDuckDB 2>&1 | grep -E "Elapsed|Maximum resident|Built SubstraitLean.LiftDuckDB|error" | cut -c1-300
