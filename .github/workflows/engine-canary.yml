name: Engine canary

# The engine release canary (#2053, ruling 198, D70, K1 to K6; `sverify_dev.canary`).
# Once a day it compares each engine's latest PyPI release with the versions its profile
# was probed at (`version` and `alsoProbed` of `engines/<engine>/Sverify/…/Tables.lean`) and
# stops in seconds when nothing is new. For a release nobody has probed, one heavy job
# runs: the upstream-bug ledger's entries fixed in that release, every fact probe compared
# with its recording, the engine's suite with the full Hypothesis counts, and the
# `outside-repo` set (python/scripts/wheel_tests.sh), the last two on that release instead
# of the lock's. It files one issue per engine version and edits it in place: each drift
# is classed error-side or value-side, and value-side drift inside the range is a bug.
# A version that has its issue is not run again; by hand, `engine` and `version` run one.
#
# It is no required check and no part of `qa` (K4), files nothing upstream (K6), and
# names no Snowflake behaviour (K5). Pause: set the repository variable
# ENGINE_CANARY_PAUSED to `true` (or `gh workflow disable engine-canary.yml`).

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to run by hand (duckdb, polars or spark), with its version
        default: ""
      version:
        description: Release of that engine, for instance 2.0.2
        default: ""

permissions:
  contents: read

jobs:
  poll:
    if: vars.ENGINE_CANARY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.poll.outputs.matrix }}
      any: ${{ steps.poll.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: python/tools
          ENGINE: ${{ inputs.engine }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$ENGINE" ] || [ -n "$VERSION" ]; then
            m=$(python3 -m sverify_dev.canary poll --engine "$ENGINE" --version "$VERSION")
          else
            m=$(python3 -m sverify_dev.canary poll)
          fi
          echo "matrix: $m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "any=$(python3 -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$m")" >> "$GITHUB_OUTPUT"

  checker:
    needs: poll
    if: needs.poll.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-checker

  heavy:
    needs: [poll, checker]
    name: heavy (${{ matrix.engine }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.poll.outputs.matrix) }}
    env:
      ENGINE: ${{ matrix.engine }}
      VERSION: ${{ matrix.version }}
      PYTHONPATH: python/tools
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/checker
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          prune-cache: true
          cache-suffix: pruned
      - name: Install the repository, then this engine release over the lock's
        run: |
          pkg=$(python3 -c 'from sverify_dev.canary import ENGINES; import os; print(ENGINES[os.environ["ENGINE"]].package)')
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          uv sync --locked --project python
          uv pip install --python python/.venv/bin/python "$pkg==$VERSION"
      # K2, step one: the ledger's entries that name this release (in `collect` below).
      # Step two: every probe, compared with its recording.
      - name: Probe the facts
        id: probes
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/old" drift
          files=$(python3 -m sverify_dev.canary files --engine "$ENGINE")
          for f in $files; do cp "$f" "$RUNNER_TEMP/old/$(basename "$f")"; done
          code=0
          while read -r cmd; do
            PYTHONPATH=python/tools python/.venv/bin/python -m $cmd || code=1
          done < <(python3 -m sverify_dev.canary commands --engine "$ENGINE")
          if [ "$code" = 0 ]; then
            for f in $files; do
              python3 -m sverify_dev.canary drift --engine "$ENGINE" \
                --old "$RUNNER_TEMP/old/$(basename "$f")" --new "$f" > "drift/$(basename "$f")" || code=1
            done
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Step three: the engine's suite with the full Hypothesis counts, then the
      # `outside-repo` fast set, on this release. Their exit codes go to the issue.
      - name: The engine's suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          python/.venv/bin/poe -C python "test-$ENGINE" 2>&1 | tee suite.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: The outside-repo set
        id: outside
        continue-on-error: true
        run: |
          set +e
          WHEEL_TESTS_ENGINE="$PKG==$VERSION" bash python/scripts/wheel_tests.sh --editable python --fast -n 4 \
            --dist worksteal 2>&1 | tee outside.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # Whatever happened before, the issue is filed: a release that breaks a probe is the
      # likeliest finding, and without an issue the next poll would run it again.
      - name: File or update the issue
        if: always()
        run: |
          shopt -s nullglob
          drifts=$(for f in drift/*; do printf -- '--drift %s ' "$f"; done)
          python3 -m sverify_dev.canary collect --engine "$ENGINE" --version "$VERSION" $drifts \
            --probe-exit "${{ steps.probes.outputs.code }}" \
            --suite-exit "${{ steps.suite.outputs.code }}" --suite-log suite.log \
            --outside-exit "${{ steps.outside.outputs.code }}" --outside-log outside.log \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > results.json
          python3 -m sverify_dev.canary report --engine "$ENGINE" --version "$VERSION" \
            --results results.json --post
          python3 -m sverify_dev.canary report --engine "$ENGINE" --version "$VERSION" \
            --results results.json >> "$GITHUB_STEP_SUMMARY"
