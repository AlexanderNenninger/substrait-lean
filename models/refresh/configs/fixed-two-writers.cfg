\* expect: pass
\* all fixes, two writers, a durable source
INIT Init
NEXT Next
CONSTANTS
    Slots = {s1, s2}
    NumPlans = 2
    MaxChanges = 2
    MaxCrashes = 1
    MaxLostAcks = 1
    MaxForeign = 0
    MaxLog = 6
    Durable = TRUE
    FixLast = TRUE
    FixCas = TRUE
    FixDigest = TRUE
    FixResume = TRUE
    FixForeign = TRUE
CONSTRAINT LogConstraint
INVARIANTS TypeOK NoCorruption RecordDescribesTable ReadIsHead Monotone NoNeedlessRewrite NoRewriteUnchanged
SYMMETRY SlotSymmetry
VIEW LogView
