\* expect: violated NoCorruption
\* a change lands on rows another application changed
INIT Init
NEXT Next
CONSTANTS
    Slots = {s1}
    NumPlans = 1
    MaxChanges = 1
    MaxCrashes = 0
    MaxLostAcks = 0
    MaxForeign = 1
    MaxLog = 10
    Durable = TRUE
    FixLast = FALSE
    FixCas = FALSE
    FixDigest = FALSE
    FixResume = FALSE
    FixForeign = FALSE
INVARIANTS TypeOK NoCorruption
VIEW LogView
