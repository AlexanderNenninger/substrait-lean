\* expect: pass
\* all fixes, two writers and a foreign writer, a source that cannot restore (homelab: DEEP=1)
INIT Init
NEXT Next
CONSTANTS
    Slots = {s1, s2}
    NumPlans = 2
    MaxChanges = 2
    MaxCrashes = 1
    MaxLostAcks = 1
    MaxForeign = 1
    MaxLog = 6
    Durable = FALSE
    FixLast = TRUE
    FixCas = TRUE
    FixDigest = TRUE
    FixResume = TRUE
    FixForeign = TRUE
CONSTRAINT LogConstraint
INVARIANTS TypeOK NoCorruption RecordDescribesTable ReadIsHead Monotone NoNeedlessRewrite NoRewriteUnchanged
SYMMETRY SlotSymmetry
VIEW LogView
