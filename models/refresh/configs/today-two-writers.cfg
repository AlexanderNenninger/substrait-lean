\* expect: violated NoCorruption
\* two live writers: a change lands on the other writer's commit
INIT Init
NEXT Next
CONSTANTS
    Slots = {s1, s2}
    NumPlans = 1
    MaxChanges = 2
    MaxCrashes = 0
    MaxLostAcks = 0
    MaxForeign = 0
    MaxLog = 6
    Durable = TRUE
    FixLast = FALSE
    FixCas = FALSE
    FixDigest = FALSE
    FixResume = FALSE
    FixForeign = FALSE
CONSTRAINT LogConstraint
INVARIANTS TypeOK NoCorruption
SYMMETRY SlotSymmetry
VIEW LogView
