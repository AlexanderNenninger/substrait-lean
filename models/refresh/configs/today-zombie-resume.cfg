\* expect: violated NoCorruption
\* one writer: a restart resumes, a zombie lands, the restart's change lands on it
INIT Init
NEXT Next
CONSTANTS
    Slots = {s1}
    NumPlans = 1
    MaxChanges = 2
    MaxCrashes = 1
    MaxLostAcks = 0
    MaxForeign = 0
    MaxLog = 10
    Durable = TRUE
    FixLast = FALSE
    FixCas = FALSE
    FixDigest = FALSE
    FixResume = FALSE
    FixForeign = FALSE
INVARIANTS TypeOK NoCorruption
VIEW LogView
