# Tables of each dataset, as Ibis types, with only the columns the catalogued
# queries use. `values` gives pools for the synthetic data ("table.column"),
# so that filters on the literals the queries use match some rows; other
# integers are drawn from 0..5 (so keys join), and every column is NULL one
# time in ten unless listed in `not_null`.

# TPC-H's tables have no NULLs, and the primary keys of the single-column-keyed tables are keys (spec 1.4).
[datasets.tpch]
keys = ["customer.c_custkey", "orders.o_orderkey", "part.p_partkey", "supplier.s_suppkey", "nation.n_nationkey", "region.r_regionkey"]
not_null = [
    "lineitem.l_orderkey", "lineitem.l_partkey", "lineitem.l_suppkey", "lineitem.l_linenumber",
    "lineitem.l_quantity", "lineitem.l_extendedprice", "lineitem.l_discount", "lineitem.l_tax",
    "lineitem.l_returnflag", "lineitem.l_linestatus", "lineitem.l_shipdate", "lineitem.l_commitdate",
    "lineitem.l_receiptdate", "lineitem.l_shipinstruct", "lineitem.l_shipmode", "orders.o_orderkey",
    "orders.o_custkey", "orders.o_orderstatus", "orders.o_totalprice", "orders.o_orderdate",
    "orders.o_orderpriority", "orders.o_shippriority", "orders.o_comment", "customer.c_custkey",
    "customer.c_name", "customer.c_address", "customer.c_nationkey", "customer.c_phone",
    "customer.c_acctbal", "customer.c_mktsegment", "customer.c_comment", "part.p_partkey",
    "part.p_name", "part.p_mfgr", "part.p_brand", "part.p_type",
    "part.p_size", "part.p_container", "supplier.s_suppkey", "supplier.s_name",
    "supplier.s_address", "supplier.s_nationkey", "supplier.s_phone", "supplier.s_acctbal",
    "supplier.s_comment", "partsupp.ps_partkey", "partsupp.ps_suppkey", "partsupp.ps_availqty",
    "partsupp.ps_supplycost", "nation.n_nationkey", "nation.n_name", "nation.n_regionkey",
    "region.r_regionkey", "region.r_name",
]

