# -- a threshold on the aggregate in the plan (HAVING) -------------------------

[[case]]
id = "having-sum"
pattern = "having"
dataset = "app"
ibis = '''
q = orders.group_by("customer_id").aggregate(total=_.amount.sum()).filter(_.total > 1000)
'''
requires = "{'orders': [_.amount >= 0]}"
ensures = "[sv.unique('customer_id')]"

[[case]]
id = "having-sum-bound"
pattern = "having"
dataset = "app"
ibis = '''
q = orders.group_by("customer_id").aggregate(total=_.amount.sum()).filter(_.total > 1000)
'''
requires = "{'orders': [_.amount >= 0]}"
ensures = "[_.total > 1000]"

[[case]]
id = "having-sum-approx"
pattern = "having"
dataset = "app"
ibis = '''
q = orders.group_by("customer_id").aggregate(total=_.amount.sum()).filter(_.total > 1000)
'''
requires = "{'orders': [_.amount.between(0, 1000), sv.max_rows(1000)]}"
ensures = "[sv.approx(_.total >= 1000)]"

[[case]]
