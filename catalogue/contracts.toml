# Contracts analysts write over aggregates of doubles, and a few controls
# (#929, D25, D30). Each case is a query over one of `schemas.toml`'s datasets
# with its `requires` and `ensures`, in the scope of `queries/*.toml`. Unlike
# the queries, these are not collected from public sources: they are the
# patterns a contract on a double SUM, AVG, VAR or STDDEV takes (a bound, a
# HAVING threshold, a top-N, an exact or tolerant observation, a window), so
# that `contracts.json` counts how each reaches the engines.
#
# `pattern` groups the cases in the census table. Regenerate the results with
#
#     uv run python -m sverify_dev.contract_census --write
#
# and review the diff of `contracts.json`; `tests/test_contract_census.py`
# checks them.

# -- a bound on the aggregate --------------------------------------------------

[[case]]
id = "sum-nonneg"
pattern = "bound"
dataset = "app"
ibis = 'q = orders.group_by("customer_id").aggregate(total=_.amount.sum())'
requires = "{'orders': [_.amount >= 0]}"
ensures = "[_.total.isnull() | (_.total >= 0)]"

[[case]]
id = "avg-range"
pattern = "bound"
dataset = "h2o"
ibis = 'q = x.group_by("id1").aggregate(m=_.v3.mean())'
requires = "{'x': [_.v3.between(0, 100)]}"
ensures = "[_.m.between(0, 100)]"

