# -- ORDER BY and top-N on the aggregate --------------------------------------

[[case]]
id = "top-n-sum"
pattern = "top_n"
dataset = "app"
ibis = '''
q = (
    orders.group_by("customer_id").aggregate(total=_.amount.sum())
    .order_by(ibis.desc("total")).limit(10)
)
'''
requires = "{'orders': [_.amount >= 0]}"
ensures = "[sv.unique('customer_id')]"

[[case]]
id = "top-1-avg"
pattern = "top_n"
dataset = "h2o"
ibis = '''
q = x.group_by("id1").aggregate(m=_.v3.mean()).order_by(ibis.desc("m")).limit(1)
'''
requires = "{'x': [_.v3.between(0, 100)]}"
ensures = "[_.m.between(0, 100)]"

[[case]]
id = "order-by-sum-sequence"
pattern = "top_n"
dataset = "app"
ibis = '''
q = orders.group_by("customer_id").aggregate(total=_.amount.sum()).order_by(ibis.desc("total"), "customer_id")
'''
requires = "{'orders': [_.amount >= 0]}"
ensures = "[sv.equivalent(rows='sequence')]"

[[case]]
id = "rank-by-sum"
pattern = "top_n"
dataset = "app"
ibis = '''
s = orders.group_by("customer_id").aggregate(total=_.amount.sum())
q = s.mutate(rk=ibis.rank().over(ibis.window(order_by=ibis.desc(s.total))))
'''
requires = "{'orders': [_.amount >= 0]}"
ensures = "[_.rk >= 0]"

