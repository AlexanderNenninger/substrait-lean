[[case]]
id = "revenue-nonneg"
pattern = "bound"
dataset = "app"
ibis = '''
q = order_items.group_by("order_id").aggregate(revenue=(_.price * _.qty.cast("float64")).sum())
'''
requires = "{'order_items': [_.price.between(0, 1e6), _.qty.between(0, 1000)]}"
ensures = "[_.revenue.isnull() | (_.revenue >= 0)]"

