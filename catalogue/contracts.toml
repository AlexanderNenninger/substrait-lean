# -- a threshold on the aggregate in an expression ----------------------------

[[case]]
id = "tier-by-avg"
pattern = "expression"
dataset = "h2o"
ibis = '''
q = x.group_by("id1").aggregate(m=_.v3.mean()).mutate(tier=ibis.ifelse(_.m >= 50, "high", "low"))
'''
requires = "{'x': [_.v3.between(0, 100)]}"
ensures = "[_.tier.isin(['high', 'low'])]"

[[case]]
id = "group-by-rounded-avg"
pattern = "expression"
dataset = "h2o"
ibis = '''
q = x.group_by("id1").aggregate(m=_.v3.mean()).group_by(b=_.m.floor()).aggregate(n=_.count())
'''
requires = "{'x': [_.v3.between(0, 100)]}"
ensures = "[_.n >= 1]"

# -- windows -------------------------------------------------------------------

[[case]]
id = "running-sum"
pattern = "window"
dataset = "app"
ibis = '''
w = ibis.window(group_by="sensor_id", order_by="ts", preceding=None, following=0)
q = readings.mutate(cum=_.value.sum().over(w))
'''
requires = "{'readings': [_.value >= 0]}"
ensures = "[_.cum.isnull() | (_.cum >= 0)]"

[[case]]
id = "moving-avg"
pattern = "window"
dataset = "app"
ibis = '''
w = ibis.window(group_by="sensor_id", order_by="ts", preceding=2, following=0)
q = readings.mutate(ma=_.value.mean().over(w))
'''
requires = "{'readings': [_.value.between(0, 100)]}"
ensures = "[_.ma.isnull() | _.ma.between(0, 100)]"

[[case]]
id = "above-group-avg"
pattern = "window"
dataset = "app"
ibis = '''
q = readings.mutate(m=_.value.mean().over(group_by="sensor_id")).filter(_.value > _.m)
'''
requires = "{'readings': [_.value.between(0, 100)]}"
ensures = "[_.value > _.m]"

[[case]]
id = "zscore-outliers"
pattern = "window"
dataset = "app"
ibis = '''
w = ibis.window(group_by="sensor_id")
q = (
    readings.mutate(z=(_.value - _.value.mean().over(w)) / _.value.std().over(w))
    .filter(_.z.abs() > 3)
)
'''
requires = "{'readings': [_.value.between(0, 100)]}"
ensures = "[_.z.abs() > 3]"

