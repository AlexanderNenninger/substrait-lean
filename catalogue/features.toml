# The operators and features a catalogued query may need.
#
# `lean` is what `sverify` covers today on the way into Lean (its Ibis
# producer for Ibis expressions, DataFusion's for SQL) and in the Lean model
# and `substrait-check`, found by probing (`sverify.coverage` and the
# catalogue's own probes), not by reading:
#   yes      it reaches the checker, which parses it and `Rel.eval` gives it SQL's meaning;
#   partial  some forms only (the note says which);
#   no       the checker rejects it, or DataFusion cannot produce a plan.
# `tests/test_catalogue.py` keeps these honest: a verified query may not need a
# `no` feature, and a refused one must need some feature that is not `yes`.

[relational]
filter = { lean = "yes", description = "WHERE on base rows" }
project = { lean = "yes", description = "computed columns, renames, column pruning" }
inner_join = { lean = "yes", description = "equi inner join" }
left_join = { lean = "yes", description = "left (or right) outer join" }
full_join = { lean = "yes", description = "full outer join", note = "parsed as a union of left join and anti join" }
semi_join = { lean = "yes", description = "semi join, IN (subquery), EXISTS as a join" }
anti_join = { lean = "yes", description = "anti join, NOT EXISTS as a join" }
cross_join = { lean = "yes", description = "cartesian product" }
non_equi_join = { lean = "partial", description = "join on <, <=, BETWEEN of the two sides", note = "integers and timestamps only: string < is NULL in the model, so engines refuse it" }
self_join = { lean = "yes", description = "a table joined with itself" }
multi_join = { lean = "yes", description = "four or more tables joined (star or snowflake schema)" }
asof_join = { lean = "yes", description = "latest right row at or before each left row", note = "sverify.asof_join: range join + ROW_NUMBER; DataFusion has no native ASOF" }
range_join = { lean = "yes", description = "join on a value lying between two columns (SCD2 validity, intervals)" }
union_all = { lean = "yes", description = "UNION ALL" }
union_distinct = { lean = "yes", description = "UNION (distinct)" }
intersect_except = { lean = "yes", description = "INTERSECT / EXCEPT" }
distinct = { lean = "yes", description = "SELECT DISTINCT" }
values = { lean = "yes", description = "inline VALUES table" }
sort_by_expression = { lean = "no", description = "ORDER BY an expression rather than a column", note = "the Ibis producer refuses it (\"sort by a column\")" }
order_by = { lean = "yes", description = "ORDER BY in the result" }
limit = { lean = "yes", description = "LIMIT / top-N after a sort" }
offset = { lean = "yes", description = "OFFSET (pagination)" }
cte = { lean = "yes", description = "non-recursive WITH (inlined)" }
recursive_cte = { lean = "no", description = "WITH RECURSIVE", note = "DataFusion plans it (without a column list) but its Substrait producer has no RecursiveQuery; no fixpoint in the model" }
in_subquery = { lean = "yes", description = "x IN (SELECT …)" }
not_in_subquery = { lean = "no", description = "x NOT IN (SELECT …), with its NULL semantics", note = "refused: DataFusion gets NULLs in the subquery wrong" }
exists_subquery = { lean = "no", description = "EXISTS / NOT EXISTS with a correlated subquery", note = "DataFusion's Substrait producer cannot convert Exists" }
scalar_subquery = { lean = "no", description = "uncorrelated scalar subquery (x > (SELECT avg …))", note = "DataFusion's Substrait producer cannot convert it; rewrite as a cross join with a one-row aggregate" }
correlated_subquery = { lean = "no", description = "correlated scalar subquery", note = "as scalar_subquery; rewrite as a join with a grouped aggregate" }
unnest = { lean = "no", description = "UNNEST / explode of lists", note = "DataFusion's Substrait producer has no Unnest" }
pivot = { lean = "yes", description = "pivot with a fixed list of values (conditional aggregates)", note = "Ibis pivot_wider compiles to first_value, which is refused; write it as sum/max with where=" }
unpivot = { lean = "partial", description = "unpivot / melt", note = "as a UNION ALL of projections only; Ibis pivot_longer compiles to UNNEST" }
generate_series = { lean = "partial", description = "generate a spine of numbers or dates", note = "constant ranges only (folded to VALUES); date ranges need month intervals or a calendar table" }

[aggregation]
group_by = { lean = "yes", description = "GROUP BY with aggregates" }
global_aggregate = { lean = "yes", description = "aggregate over the whole input (one row, also when empty)" }
count = { lean = "yes", description = "COUNT(*) / COUNT(x)" }
sum = { lean = "yes", description = "SUM of integers or doubles", note = "SUM of DECIMAL is refused, see decimal" }
avg = { lean = "yes", description = "AVG" }
min_max = { lean = "partial", description = "MIN / MAX", note = "integers, strings, dates and timestamps; MIN/MAX of doubles and DECIMAL are refused" }
count_distinct = { lean = "yes", description = "COUNT(DISTINCT x)" }
agg_filter = { lean = "yes", description = "conditional aggregate: FILTER (WHERE …) or SUM(CASE …)" }
agg_arithmetic = { lean = "no", description = "arithmetic on aggregate results inside one aggregation (SUM(a) / SUM(b), MAX - MIN, 100 * SUM(x))", note = "the Ibis producer refuses it (\"aggregate Divide is not supported\"); DataFusion's SQL path, which projects after the aggregate, verified it" }
having = { lean = "yes", description = "HAVING" }
grouping_sets = { lean = "no", description = "ROLLUP / CUBE / GROUPING SETS" }
stddev_var = { lean = "no", description = "STDDEV / VARIANCE" }
corr = { lean = "no", description = "CORR / COVAR / REGR_*" }
percentile = { lean = "no", description = "MEDIAN / PERCENTILE_CONT / quantile", note = "refused by the Ibis producer (aggregate Median/Quantile) and by the checker for SQL; Ibis cannot even compile quantile to DataFusion SQL" }
approx_distinct = { lean = "no", description = "APPROX_COUNT_DISTINCT / HyperLogLog" }
string_agg = { lean = "no", description = "STRING_AGG / LISTAGG / ARRAY_AGG / collect" }
arg_max = { lean = "no", description = "ARG_MAX / first or last value of a group, ordered aggregates", note = "first_value aggregates are refused" }
bool_agg = { lean = "no", description = "BOOL_AND / BOOL_OR / EVERY" }

[windows]
row_number = { lean = "yes", description = "ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)" }
lag_lead = { lean = "yes", description = "LAG / LEAD" }
rank = { lean = "yes", description = "RANK / DENSE_RANK", note = "peers by the sort keys (`WinFn.rank`): independent of the order of ties" }
ntile = { lean = "yes", description = "NTILE / PERCENT_RANK / CUME_DIST", note = "NTILE as DataFusion computes it, ⌊i·min(k, n)/n⌋ + 1 (not the SQL standard's buckets; the SQL engines compute it from ROW_NUMBER and COUNT)" }
first_last_value = { lean = "yes", description = "FIRST_VALUE / LAST_VALUE / NTH_VALUE over a window", note = "over ROWS or RANGE frames; they follow the order of ties" }
window_partition_agg = { lean = "yes", description = "aggregate over a whole partition (SUM(x) OVER (PARTITION BY g)), incl. percent of total", note = "of a column (an expression is refused); integer sums may wrap around (`Issue.sumWraps`)" }
running_agg = { lean = "yes", description = "running aggregate (ROWS/RANGE UNBOUNDED PRECEDING to CURRENT ROW)" }
rows_frame = { lean = "partial", description = "bounded ROWS frame (moving average over n rows)", note = "SUM/COUNT/MAX of integers and FIRST/LAST/NTH_VALUE verify; AVG and SUM of doubles and MIN over a sliding frame are refused: DataFusion retracts rows wrongly (NaN for an emptied AVG, a stale MIN, different rounding)" }
range_frame = { lean = "partial", description = "RANGE frame over an interval (last 7 days)", note = "offsets on one integer, timestamp or date key, from Ibis (a condition on the key; NULL keys are only their own peers). DataFusion's Substrait producer drops RANGE offsets, so such SQL is refused, and DataFusion cannot run Ibis's SQL for an interval frame. Sliding AVG/MIN as for rows_frame" }
window_over_aggregate = { lean = "yes", description = "window over a grouped result (LAG of a monthly sum, SUM(SUM(x)) OVER ())", note = "the plan shape is fine; the window function itself must be supported" }
qualify = { lean = "yes", description = "filter on a window result (QUALIFY, or a subquery)" }
dedup_latest = { lean = "yes", description = "keep one row per key, the latest (ROW_NUMBER = 1)" }

[expressions]
arithmetic_int = { lean = "yes", description = "+ - * on integers" }
arithmetic_float = { lean = "yes", description = "+ - * / on doubles" }
integer_division = { lean = "yes", description = "integer / or % (truncating), or Ibis floor //" }
decimal = { lean = "no", description = "DECIMAL(p, s) columns and arithmetic", note = "sverify's Ibis producer refuses any DECIMAL column (\"type decimal(15, 2) is not supported\"); through DataFusion's SQL producer, columns pass through and compare but SUM/AVG/MIN/MAX and literals are refused. The catalogue also probes each failing query with DOUBLE in their place" }
case_when = { lean = "yes", description = "CASE WHEN / ifelse" }
coalesce_nullif = { lean = "yes", description = "COALESCE / NULLIF / fill_null" }
in_list = { lean = "yes", description = "x IN (literal list)" }
between = { lean = "yes", description = "BETWEEN" }
cast_numeric = { lean = "yes", description = "casts between integer, double and string" }
cast_date = { lean = "partial", description = "casts of dates and timestamps", note = "string → date literal yes; date → string no" }
like = { lean = "yes", description = "LIKE / NOT LIKE / contains / startswith" }
regex_match = { lean = "yes", description = "regular-expression match" }
regex_replace = { lean = "no", description = "REGEXP_REPLACE / REGEXP_EXTRACT" }
string_basic = { lean = "yes", description = "substr, upper, lower, length, concat, trim, strpos" }
string_split = { lean = "no", description = "SPLIT_PART / CONCAT_WS / string split" }
string_compare = { lean = "partial", description = "<, > on strings (also MIN/MAX of strings)", note = "MIN/MAX yes; < and > are NULL in the model, and every engine refuses them" }
math_funcs = { lean = "yes", description = "round, floor, ceil, abs, power, greatest, least" }
hash = { lean = "no", description = "MD5 / hashing (surrogate keys)" }
date_literal = { lean = "yes", description = "DATE / TIMESTAMP literals", note = "with sverify's Ibis producer ibis.date(…) works; through Ibis's DataFusion SQL it compiled to DATE_TRUNC('DAY', …), which the checker refuses. The catalogue writes D(…), a cast, which works both ways" }
date_part = { lean = "partial", description = "EXTRACT(year / month / dow … FROM x)", note = "timestamps and dates (`UnFn.dayPart`); EPOCH refused (Ibis epoch_seconds() works)" }
time_bucket = { lean = "no", description = "fixed-width time buckets (15 minutes): DATE_BIN, Ibis bucket, group_by_dynamic", note = "refused by the Ibis producer (TimestampBucket), which Ibis cannot compile to DataFusion SQL either; DATE_BIN is refused by the checker" }
date_trunc = { lean = "yes", description = "DATE_TRUNC / truncate", note = "timestamps, and dates to a day or longer (`UnFn.dayTrunc`; DataFusion goes through nanoseconds, so an error is reported outside 1677-2262)" }
interval_day_time = { lean = "yes", description = "x ± INTERVAL in days, hours, minutes", note = "timestamps, and DATE ± whole days (`BinFn.dateAdd`). Comparing a duration with an interval of days is refused: DataFusion compares it as (months, days, ns)" }
dynamic_interval = { lean = "partial", description = "an interval built from a column (n days, rn * INTERVAL '1 day')", note = "a column's count of days added to a DATE (the Ibis producer writes n * INTERVAL '1 day'); added to a timestamp, or of months, refused. Ibis's DataFusion SQL, CAST(CAST(n AS VARCHAR) || ' day' AS INTERVAL), fails on NULL" }
interval_month = { lean = "yes", description = "x ± INTERVAL in months or years", note = "constant months added to a date or timestamp, clamped to the end of a shorter month (`Time.addMonths`), before any days, as DataFusion does" }
date_diff = { lean = "partial", description = "difference of two dates or timestamps", note = "timestamps, and Ibis's DateDiff/delta of dates (`BinFn.dateDiff`); DataFusion's DATE - DATE is refused: a duration it compares wrongly with intervals" }
interval_to_number = { lean = "partial", description = "a duration as a number of seconds (time weighting, rates per second)", note = "Ibis epoch_seconds() differences and delta(unit=\"day\") of dates work; casting an interval to a number is refused" }
math_transcendental = { lean = "no", description = "LN, EXP, LOG, SQRT (log returns, volatility)", note = "unsupported function ln/1" }
epoch = { lean = "partial", description = "EXTRACT(EPOCH …) / epoch seconds / to_char", note = "Ibis epoch_seconds() works (built from date parts), and so do to_char/strftime with %Y %m %d %H %M %S %j %F %T; date_part('EPOCH') and other directives are refused" }
time_of_day = { lean = "yes", description = "TIME values: CAST(ts AS TIME), clock parts, comparisons", note = "microseconds since midnight (`Kind.tod`); time + interval and truncating a time are refused (DataFusion cannot add intervals to times)" }
timezone = { lean = "no", description = "time zones (AT TIME ZONE, tz-aware timestamps)" }
json = { lean = "no", description = "JSON / semi-structured extraction" }
