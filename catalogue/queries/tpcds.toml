# TPC-DS: a representative subset of the retail decision-support benchmark,
# chosen for breadth (star joins, ROLLUP, ranking, windows over aggregates,
# running sums). Intent paraphrased from the TPC-DS specification v4.0.0 and the
# official query templates (TPC EULA); concrete SQL as generated by dsqgen is
# also in apache/datafusion-benchmarks (Apache-2.0). Expressions are our own,
# with the qualification parameters.
dataset = "tpcds"

[[query]]
id = "tpcds-q03"
title = "TPC-DS Q3: brand revenue for a manufacturer in one month"
intent = "Report yearly November store revenue per brand for one manufacturer's items."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 3", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "group_by", "sum", "order_by", "limit", "decimal"]
pitfalls = ["tie_order: top 100 by year, revenue DESC, brand_id"]
ibis = '''
j = (
    date_dim.join(store_sales, date_dim.d_date_sk == store_sales.ss_sold_date_sk)
    .join(item, store_sales.ss_item_sk == item.i_item_sk)
    .filter((_.i_manufact_id == 128) & (_.d_moy == 11))
)
q = (
    j.group_by(["d_year", "i_brand_id", "i_brand"])
    .aggregate(sum_agg=_.ss_ext_sales_price.sum())
    .order_by(["d_year", ibis.desc("sum_agg"), "i_brand_id"])
    .limit(100)
)
'''

[[query]]
id = "tpcds-q07"
title = "TPC-DS Q7: promotional item averages for a demographic"
intent = "Average quantity and prices per item for single college-educated men in a year, for sales without email or event promotion."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 7", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "multi_join", "group_by", "avg", "order_by", "limit", "decimal"]
pitfalls = ["decimal_scale: AVG of DECIMAL(7,2) gets a different scale in each engine"]
ibis = '''
j = (
    store_sales.join(date_dim, store_sales.ss_sold_date_sk == date_dim.d_date_sk)
    .join(item, store_sales.ss_item_sk == item.i_item_sk)
    .join(customer_demographics, store_sales.ss_cdemo_sk == customer_demographics.cd_demo_sk)
    .join(promotion, store_sales.ss_promo_sk == promotion.p_promo_sk)
    .filter(
        (_.cd_gender == "M")
        & (_.cd_marital_status == "S")
        & (_.cd_education_status == "College")
        & ((_.p_channel_email == "N") | (_.p_channel_event == "N"))
        & (_.d_year == 2000)
    )
)
q = (
    j.group_by("i_item_id")
    .aggregate(
        agg1=_.ss_quantity.mean(),
        agg2=_.ss_list_price.mean(),
        agg3=_.ss_coupon_amt.mean(),
        agg4=_.ss_sales_price.mean(),
    )
    .order_by("i_item_id")
    .limit(100)
)
'''

[[query]]
id = "tpcds-q27"
title = "TPC-DS Q27: item averages per state with subtotals"
intent = "Average item quantities and prices per item and state, with subtotals per item and a grand total (ROLLUP)."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 27", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "multi_join", "grouping_sets", "avg", "in_list", "order_by", "limit", "decimal"]
pitfalls = ["null_ordering: ROLLUP's subtotal rows have NULL keys, so their place in ORDER BY i_item_id, s_state depends on the NULL order", "decimal_scale: AVG of DECIMAL"]
sql = '''
SELECT i_item_id, s_state, GROUPING(s_state) AS g_state,
       AVG(ss_quantity) AS agg1, AVG(ss_list_price) AS agg2,
       AVG(ss_coupon_amt) AS agg3, AVG(ss_sales_price) AS agg4
FROM store_sales
JOIN customer_demographics ON ss_cdemo_sk = cd_demo_sk
JOIN date_dim ON ss_sold_date_sk = d_date_sk
JOIN store ON ss_store_sk = s_store_sk
JOIN item ON ss_item_sk = i_item_sk
WHERE cd_gender = 'M' AND cd_marital_status = 'S' AND cd_education_status = 'College'
  AND d_year = 2002 AND s_state IN ('TN', 'SD', 'AL')
GROUP BY ROLLUP (i_item_id, s_state)
ORDER BY i_item_id, s_state
LIMIT 100
'''
notes = "Ibis has no ROLLUP or GROUPING SETS, so this is DataFusion SQL."

[[query]]
id = "tpcds-q36"
title = "TPC-DS Q36: gross margin ranking across a category hierarchy"
intent = "Rank item classes within categories by gross margin, with ROLLUP subtotals ranked at their own level."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 36", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "multi_join", "grouping_sets", "sum", "rank", "window_over_aggregate", "case_when", "in_list", "order_by", "limit", "decimal"]
pitfalls = ["rank_semantics: RANK leaves gaps after ties", "division_by_zero: margin divides by SUM(ss_ext_sales_price), which can be 0", "null_ordering: ORDER BY lochierarchy DESC, CASE … with NULL rollup keys"]
sql = '''
SELECT SUM(ss_net_profit) / SUM(ss_ext_sales_price) AS gross_margin,
       i_category, i_class,
       GROUPING(i_category) + GROUPING(i_class) AS lochierarchy,
       RANK() OVER (
         PARTITION BY GROUPING(i_category) + GROUPING(i_class),
                      CASE WHEN GROUPING(i_class) = 0 THEN i_category END
         ORDER BY SUM(ss_net_profit) / SUM(ss_ext_sales_price) ASC) AS rank_within_parent
FROM store_sales
JOIN date_dim ON d_date_sk = ss_sold_date_sk
JOIN item ON i_item_sk = ss_item_sk
JOIN store ON s_store_sk = ss_store_sk
WHERE d_year = 2001 AND s_state IN ('TN', 'SD', 'AL')
GROUP BY ROLLUP (i_category, i_class)
ORDER BY lochierarchy DESC,
         CASE WHEN lochierarchy = 0 THEN i_category END,
         rank_within_parent
LIMIT 100
'''
notes = "Ibis has no ROLLUP, so this is DataFusion SQL."

[[query]]
id = "tpcds-q42"
title = "TPC-DS Q42: category revenue for a manager in one month"
intent = "Total one month's store revenue per item category for items of one manager."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 42", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "group_by", "sum", "order_by", "limit", "decimal"]
ibis = '''
j = (
    date_dim.join(store_sales, date_dim.d_date_sk == store_sales.ss_sold_date_sk)
    .join(item, store_sales.ss_item_sk == item.i_item_sk)
    .filter((_.i_manager_id == 1) & (_.d_moy == 11) & (_.d_year == 2000))
)
q = (
    j.group_by(["d_year", "i_category"])
    .aggregate(revenue=_.ss_ext_sales_price.sum())
    .order_by([ibis.desc("revenue"), "d_year", "i_category"])
    .limit(100)
)
'''

[[query]]
id = "tpcds-q51"
title = "TPC-DS Q51: cumulative web vs store sales"
intent = "Find the days on which an item's cumulative web sales overtook its cumulative store sales within a year."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 51", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "full_join", "group_by", "sum", "running_agg", "cte", "coalesce_nullif", "between", "order_by", "limit", "decimal", "window_over_aggregate"]
pitfalls = ["window_default_frame: the cumulative sums use the default RANGE frame, so two rows on one date share a total", "null_join_keys: the FULL JOIN keeps a side's NULLs, and MAX over the running totals skips them"]
ibis = '''
def cumulative(sales, item_col, date_col, price_col):
    daily = (
        sales.join(date_dim, sales[date_col] == date_dim.d_date_sk)
        .filter(_.d_month_seq.between(1200, 1211))
        .group_by(item_sk=_[item_col], d_date=_.d_date)
        .aggregate(amount=_[price_col].sum())
    )
    w = ibis.cumulative_window(group_by="item_sk", order_by="d_date")
    return daily.mutate(cume=daily.amount.sum().over(w)).drop("amount")
web = cumulative(web_sales, "ws_item_sk", "ws_sold_date_sk", "ws_sales_price")
store = cumulative(store_sales, "ss_item_sk", "ss_sold_date_sk", "ss_sales_price")
j = web.outer_join(store, (web.item_sk == store.item_sk) & (web.d_date == store.d_date))
both = j.select(
    item_sk=ibis.coalesce(j.item_sk, j.item_sk_right),
    d_date=ibis.coalesce(j.d_date, j.d_date_right),
    web_sales=j.cume,
    store_sales=j.cume_right,
)
w = ibis.cumulative_window(group_by="item_sk", order_by="d_date")
q = (
    both.mutate(web_cumulative=both.web_sales.max().over(w), store_cumulative=both.store_sales.max().over(w))
    .filter(_.web_cumulative > _.store_cumulative)
    .order_by(["item_sk", "d_date"])
    .limit(100)
)
'''

[[query]]
id = "tpcds-q89"
title = "TPC-DS Q89: monthly sales deviating from the yearly average"
intent = "Find store, brand and month combinations whose sales deviate more than 10% from their yearly monthly average."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 89", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "multi_join", "group_by", "sum", "window_over_aggregate", "window_partition_agg", "avg", "in_list", "case_when", "math_funcs", "order_by", "limit", "decimal", "arithmetic_float", "sort_by_expression"]
pitfalls = ["division_by_zero: the ratio divides by the average, guarded by CASE WHEN avg <> 0 (see eager_evaluation)", "eager_evaluation: DataFusion may evaluate the division before the guard"]
ibis = '''
j = (
    item.join(store_sales, store_sales.ss_item_sk == item.i_item_sk)
    .join(date_dim, store_sales.ss_sold_date_sk == date_dim.d_date_sk)
    .join(store, store_sales.ss_store_sk == store.s_store_sk)
    .filter(
        (_.d_year == 1999)
        & (
            (_.i_category.isin(["Books", "Home", "Sports"]) & _.i_class.isin(["fiction", "glassware", "football"]))
            | (_.i_category.isin(["Women", "Music"]) & _.i_class.isin(["fiction", "glassware"]))
        )
    )
)
monthly = j.group_by(["i_category", "i_class", "i_brand", "s_store_name", "s_company_name", "d_moy"]).aggregate(
    sum_sales=_.ss_sales_price.sum()
)
w = ibis.window(group_by=["i_category", "i_brand", "s_store_name", "s_company_name"])
m = monthly.mutate(avg_monthly_sales=monthly.sum_sales.mean().over(w))
q = (
    m.filter(
        ibis.ifelse(
            m.avg_monthly_sales != 0,
            (m.sum_sales - m.avg_monthly_sales).abs() / m.avg_monthly_sales,
            None,
        )
        > 0.1
    )
    .order_by([_.sum_sales - _.avg_monthly_sales, "s_store_name"])
    .limit(100)
)
'''

[[query]]
id = "tpcds-q98"
title = "TPC-DS Q98: item revenue share within its class"
intent = "Show each item's revenue in a 30-day window and its percentage of its class's revenue, for three categories."
domain = "benchmark"
source = { name = "TPC-DS v4.0.0, query 98", url = "https://github.com/gregrahn/tpcds-kit/tree/master/query_templates", licence = "TPC EULA" }
features = ["filter", "inner_join", "group_by", "sum", "window_over_aggregate", "window_partition_agg", "in_list", "between", "date_literal", "interval_day_time", "order_by", "decimal", "arithmetic_float"]
pitfalls = ["decimal_scale: revenue * 100 / SUM(revenue) OVER (…) on DECIMAL", "division_by_zero: a class with zero revenue"]
ibis = '''
start = D("1999-02-22")
j = (
    store_sales.join(item, store_sales.ss_item_sk == item.i_item_sk)
    .join(date_dim, store_sales.ss_sold_date_sk == date_dim.d_date_sk)
    .filter(_.i_category.isin(["Sports", "Books", "Home"]) & _.d_date.between(start, start + ibis.interval(days=30)))
)
rev = j.group_by(["i_item_id", "i_item_desc", "i_category", "i_class", "i_current_price"]).aggregate(
    itemrevenue=_.ss_ext_sales_price.sum()
)
q = rev.mutate(
    revenueratio=rev.itemrevenue * 100 / rev.itemrevenue.sum().over(ibis.window(group_by="i_class"))
).order_by(["i_category", "i_class", "i_item_id", "i_item_desc", "revenueratio"])
'''
