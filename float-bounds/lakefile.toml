name = "float-bounds"
defaultTargets = ["FloatBounds", "FloatBridge"]

# Kept apart from the core package so that `SubstraitLean` stays free of
# Mathlib (see docs/float-bounds.md).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "FloatBounds"

# The bridge (#1196): imports the core's codes and the reals' standard model,
# and proves the link between them that the core otherwise trusts.
[[require]]
name = "sverify-core"
path = "../core"

# The analysis's lemmas on codes (exactness on small integers), which the
# bridge combines with the bound over the reals into `SumOrder`.
[[require]]
name = "sverify-analysis"
path = "../analysis"

[[lean_lib]]
name = "FloatBridge"
