name = "sverify-analysis"
defaultTargets = ["SverifyAnalysis"]

# The analysis (#1189, step 3b): what verify proves of a plan under the core,
# with no engine in it (the contracts, keys, issues, guards). It imports only
# the core. A standalone `lake build --wfail` here is the guard (CI runs it):
# inside the root workspace an import of an engine module would resolve.

[[require]]
name = "sverify-core"
path = "../core"

[[lean_lib]]
name = "SverifyAnalysis"
roots = ["Sverify.Analysis"]
