[project]
name = "sverify"
version = "0.3.0"
description = "Contracts and incremental views, proven in Lean, on DuckDB, Polars, DataFusion, Snowflake and Spark"
readme = "README.md"
# MPL-2.0 for sverify; the vendored `ibis_substrait` keeps its Apache-2.0.
# `LICENSE` is a copy of the repository's, since license files must sit under
# this directory; `tests/test_license.py` keeps the two equal.
license = "MPL-2.0 AND Apache-2.0"
license-files = ["LICENSE", "src/sverify/ibis_substrait/LICENSE"]
authors = [
    { name = "Alexander Nenninger", email = "alexander.nenninger@live.de" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ibis-framework[duckdb]>=12.0.0",
    "pyarrow>=26.0.0",
    "substrait>=0.37.0",
]

# DuckDB is the core: the default engine, and the table store behind
# `sverify.connect()`. Other engines and table formats are extras; the SQL
# dialects (DuckDB, Snowflake, Spark) need nothing.
[project.optional-dependencies]
# DataFusion as an engine (`engine="datafusion"`), and the producer for SQL strings.
datafusion = ["datafusion==51.0.0"]
polars = ["numpy>=2.5.4", "polars>=2.1.0"]
spark = ["pyspark>=4.0"]
delta = ["deltalake>=1.6.6"]
iceberg = ["pyiceberg[pyarrow]>=0.12.0"]
# `sverify.testing` and its pytest plugin; the plugin is registered without it.
testing = ["hypothesis>=6.170.14", "pytest>=9.2.0"]
all = ["sverify[datafusion,polars,spark,delta,iceberg,testing]"]

# The pytest plugin (`sverify.pytest_plugin`): `pytest -p no:sverify` turns it off.
[project.entry-points.pytest11]
sverify = "sverify.pytest_plugin"

[project.urls]
Homepage = "https://github.com/AlexanderNenninger/substrait-lean"
Documentation = "https://alexandernenninger.github.io/substrait-lean/"
Source = "https://github.com/AlexanderNenninger/substrait-lean"
Issues = "https://github.com/AlexanderNenninger/substrait-lean/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sverify"]
# The maintainer tooling in `tools/sverify_dev` is not in the wheel, but an
# editable install (`uv sync`) puts it on `sys.path` next to `src`.
dev-mode-dirs = ["src", "tools"]
# The build hook adds `_bin/substrait-check` (a symlink there in editable installs).
exclude = ["src/sverify/_bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the Lean project under `lean/`, so building a wheel from it
# only needs elan.
[tool.hatch.build.targets.sdist]
exclude = ["build", "src/sverify/_bin"]

[tool.hatch.build.targets.sdist.force-include]
"../lakefile.toml" = "lean/lakefile.toml"
"../lake-manifest.json" = "lean/lake-manifest.json"
"../lean-toolchain" = "lean/lean-toolchain"
"../Main.lean" = "lean/Main.lean"
"../SubstraitLean.lean" = "lean/SubstraitLean.lean"
"../SubstraitLean" = "lean/SubstraitLean"

[dependency-groups]
dev = [
    "sverify[all]",
    "fakesnow>=0.12.1",
    "hypothesis>=6.170.14",
    "marimo>=0.25.2",
    "poethepoet>=0.49.0",
    "pyiceberg[sql-sqlite]>=0.12.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "snowflake-connector-python<5",
    "sqlglot>=30.22.0",
]
# The API reference site (`poe docs`): Great Docs, on Quarto (installed separately).
docs = ["great-docs>=0.11.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:The 'future.infer_string' option is deprecated"]

[tool.ruff]
line-length = 100
src = ["src", "tools", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tools", "tests", "scripts"]
# `test_polars` reuses the queries of the other test modules.
search-path = ["src", "tools", "tests"]

# Tasks: `uv run poe <task>` from python/, or `uv run --project python poe <task>`
# from the project root. Lean tasks run in the project root and need `lake`.
[tool.poe.tasks.prove]
help = "Check every Lean proof; warnings (including `sorry`) fail the build"
cmd = "lake build --wfail SubstraitLean"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.build]
help = "Build the substrait-check CLI that sverify calls"
cmd = "lake build substrait-check"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.prove-floats]
help = "Check the float error bounds (float-bounds/, needs Mathlib; not part of qa)"
shell = "lake exe cache get && lake build --wfail"
cwd = "${POE_ROOT}/../float-bounds"

[tool.poe.tasks.lint]
help = "Lint and check formatting of the Python code and the notebooks"
sequence = ["ruff check . ../notebooks", "ruff format --check . ../notebooks"]
default_item_type = "cmd"

[tool.poe.tasks.fmt]
help = "Fix lint issues and format the Python code and the notebooks"
sequence = ["ruff check --fix . ../notebooks", "ruff format . ../notebooks"]
default_item_type = "cmd"

[tool.poe.tasks.typecheck]
help = "Type-check the Python code with pyrefly"
cmd = "pyrefly check"

[tool.poe.tasks.golden]
help = "Golden tests: substrait-check output on every plan in tests/fixtures"
cmd = "tests/run.sh"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.test]
help = "Python tests, including the randomized engine tests, on every core"
cmd = "pytest -n auto --dist worksteal"

[tool.poe.tasks.test-core]
help = "Python tests of Lean and DataFusion as the reference (see tests/conftest.py)"
cmd = "pytest -n auto --dist worksteal -m core"

[tool.poe.tasks.test-datafusion]
help = "Python tests of DataFusion as an engine"
cmd = "pytest -n auto --dist worksteal -m datafusion"

[tool.poe.tasks.test-duckdb]
help = "Python tests of the DuckDB engine and its SQL"
cmd = "pytest -n auto --dist worksteal -m duckdb"

[tool.poe.tasks.test-polars]
help = "Python tests of the Polars engine"
cmd = "pytest -n auto --dist worksteal -m polars"

[tool.poe.tasks.test-snowflake]
help = "Python tests of the Snowflake SQL (on fakesnow)"
cmd = "pytest -n auto --dist worksteal -m snowflake"

[tool.poe.tasks.test-spark]
help = "Python tests of the Spark SQL (on a local Spark session, which needs a JVM)"
cmd = "pytest -n auto --dist worksteal -m spark"

[tool.poe.tasks.test-isthmus]
help = "Python tests of Isthmus as the SQL producer (needs $SVERIFY_ISTHMUS or isthmus on PATH)"
cmd = "pytest -n auto --dist worksteal tests/test_isthmus.py tests/test_without_datafusion.py"

[tool.poe.tasks.fuzz]
help = "Random queries with Lean as the oracle for $BUDGET seconds (default 600); prints new findings"
cmd = "python -m sverify_dev.fuzz --budget ${BUDGET}"
env = { BUDGET.default = "600" }

[tool.poe.tasks.compare-sql]
help = "Compile the tests' SQL with Isthmus as well as DataFusion and compare (see tests/conftest.py)"
shell = """
out=$(mktemp)
SVERIFY_COMPARE_SQL=$out SVERIFY_EXAMPLES=${SVERIFY_EXAMPLES:-0.2} \
  pytest -n auto --dist worksteal -q -m 'core or duckdb or polars' > /dev/null
python scripts/compare_sql_producers.py "$out"; status=$?
rm -f "$out"; exit $status
"""

[tool.poe.tasks.notebooks]
help = "Check the tour notebooks with marimo and run each one headless"
shell = """
marimo check --strict [0-9]*.py || exit 1
out=$(mktemp -d)
for nb in [0-9]*.py; do
  echo "running $nb"
  marimo export html "$nb" -o "$out/${nb%.py}.html" > /dev/null || exit 1
done
rm -rf "$out"
"""
cwd = "${POE_ROOT}/../notebooks"

[tool.poe.tasks.docs]
help = "Build the API reference site into great-docs/_site (needs Quarto and the docs group)"
cmd = "great-docs build"

[tool.poe.tasks.docs_preview]
help = "Build the API reference site and serve it locally"
cmd = "great-docs preview"

[tool.poe.tasks.qa]
help = "Run everything: prove, build, lint, typecheck, golden, test, notebooks"
sequence = ["prove", "build", "lint", "typecheck", "golden", "test", "notebooks"]
