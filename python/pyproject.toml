[project]
name = "sverify"
version = "0.7.0"
description = "Contracts and incremental views, proven in Lean, on DuckDB, Polars, DataFusion, Snowflake and Spark"
readme = "README.md"
# MPL-2.0 for sverify; the vendored `ibis_substrait` keeps its Apache-2.0.
# `LICENSE` is a copy of the repository's, since license files must sit under
# this directory; `tests/test_license.py` keeps the two equal.
license = "MPL-2.0 AND Apache-2.0"
license-files = ["LICENSE", "src/sverify/ibis_substrait/LICENSE"]
authors = [
    { name = "Alexander Nenninger", email = "alexander.nenninger@live.de" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ibis-framework[duckdb]>=12.0.0",
    "pyarrow>=26.0.0",
    # sverify's SQL lift is built on SQLGlot. From 30.18, SQLGlot reads a
    # DROP's names from `expressions`, so Ibis 12's DuckDB `create_table`
    # writes `DROP VIEW IF EXISTS` without one and fails (#442,
    # upstream/bugs/SG-7.json).
    "sqlglot~=30.17.0",
    "substrait>=0.37.0",
]

# DuckDB is the core: the default engine, and the table store behind
# `sverify.connect()`. Other engines and table formats are extras; the SQL
# dialects (DuckDB, Snowflake, Spark) need nothing.
[project.optional-dependencies]
# DataFusion as an engine (`engine="datafusion"`): experimental, outside the
# 1.x promise (`docs/stability.md`), and not in `all`.
datafusion = ["datafusion==51.0.0"]
polars = ["numpy>=2.5.4", "polars>=2.1.0"]
spark = ["pyspark>=4.0"]
delta = ["deltalake>=1.6.6"]
# `sql-sqlite` opens a local catalog (`IcebergSink(catalog="sqlite:///...")`).
iceberg = ["pyiceberg[pyarrow,sql-sqlite]>=0.12.0"]
# `sverify.io.flight`: pyarrow built with Flight, as the PyPI wheels are.
flight = ["pyarrow>=26.0.0"]
# `sverify.testing` and its pytest plugin; the plugin is registered without it.
testing = ["hypothesis>=6.170.14", "pytest>=9.2.0"]
# `sverify.odcs` writes and reads ODCS contracts as YAML (#791); JSON needs nothing.
odcs = ["pyyaml>=6.0"]
all = ["sverify[polars,spark,delta,iceberg,flight,testing,odcs]"]

# The command line (`sverify.cli`, #744).
[project.scripts]
sverify = "sverify.cli:main"

# The pytest plugin (`sverify.pytest_plugin`): `pytest -p no:sverify` turns it off.
[project.entry-points.pytest11]
sverify = "sverify.pytest_plugin"

[project.urls]
Homepage = "https://github.com/AlexanderNenninger/substrait-lean"
Documentation = "https://alexandernenninger.github.io/substrait-lean/"
Source = "https://github.com/AlexanderNenninger/substrait-lean"
Issues = "https://github.com/AlexanderNenninger/substrait-lean/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sverify"]
# The maintainer tooling in `tools/sverify_dev` is not in the wheel, but an
# editable install (`uv sync`) puts it on `sys.path` next to `src`.
dev-mode-dirs = ["src", "tools"]
# The build hook adds `_bin/substrait-check` (a symlink there in editable installs).
exclude = ["src/sverify/_bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the Lean project under `lean/`, so building a wheel from it
# only needs elan.
[tool.hatch.build.targets.sdist]
exclude = ["build", "src/sverify/_bin"]

[tool.hatch.build.targets.sdist.force-include]
"../lakefile.lean" = "lean/lakefile.lean"
"../lake-manifest.json" = "lean/lake-manifest.json"
"../lean-toolchain" = "lean/lean-toolchain"
"../Main.lean" = "lean/Main.lean"
"../SubstraitLean.lean" = "lean/SubstraitLean.lean"
"../SubstraitLean" = "lean/SubstraitLean"

[dependency-groups]
dev = [
    "sverify[all,datafusion]",
    "fakesnow>=0.12.1",
    "hypothesis>=6.170.14",
    # Checks the engine facts against characterization/fact.schema.json,
    # and the upstream bugs against upstream/bug.schema.json.
    "jsonschema>=4.26.0",
    "marimo>=0.25.2",
    # S3 for the Delta sink tests, run as its own process (upstream/bugs/DL-1.json).
    "moto[server]>=5.1",
    # Correctly rounded reference values for the Spark fuzzer
    # (sverify_dev.spark_fuzz); it came only through sympy before.
    "mpmath>=1.3.0",
    "poethepoet>=0.49.0",
    "pyiceberg[sql-sqlite]>=0.12.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "snowflake-connector-python<5",
    "sqlglot>=30.17.0",
]
# The API reference site (`poe docs`): Great Docs, on Quarto (installed separately).
docs = ["great-docs>=0.11.0"]

[tool.uv]
# fakesnow 0.12 needs `sqlglot~=30.22.0`, so development and the main CI
# run 30.22; the wheel's tests resolve the `~=30.17.0` users get (#442).
override-dependencies = ["sqlglot~=30.22.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:The 'future.infer_string' option is deprecated"]

[tool.ruff]
line-length = 100
src = ["src", "tools", "tests", "tests/chaos", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tools", "tests", "scripts"]
# `test_polars` reuses the queries of the other test modules.
search-path = ["src", "tools", "tests", "tests/chaos"]

# Tasks: `uv run poe <task>` from python/, or `uv run --project python poe <task>`
# from the project root. Lean tasks run in the project root and need `lake`.
[tool.poe.tasks.prove]
help = "Check every Lean proof, the generated entries' included; warnings (including `sorry`) fail the build"
cmd = "lake -R -Kcheck_generated=true build --wfail SubstraitLean"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.build]
help = "Build the substrait-check CLI that sverify calls"
cmd = "lake build substrait-check"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.regen-lowering]
help = "Search for the DuckDB lowering again and write it to SubstraitLean/LoweringDuckDB (a build only checks it)"
shell = """
lake build SubstraitLean.LoweringSearch SubstraitLean.LoweringCache SubstraitLean.LoweringDuckDB.Lemmas \
  && lake env lean -M 6144 scripts/RegenLowering.lean
"""
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.regen-lift]
help = "Search for the DuckDB SQL lift again and write it to SubstraitLean/LiftDuckDB (a build only checks it); Lean capped at 6 GB"
shell = "lake build SubstraitLean.LiftSearch SubstraitLean.LiftCache && lake env lean -M 6144 scripts/RegenLift.lean"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.prove-floats]
help = "Check the float error bounds (float-bounds/, needs Mathlib; not part of qa)"
shell = "lake exe cache get && lake build --wfail"
cwd = "${POE_ROOT}/../float-bounds"

[tool.poe.tasks.lint]
help = "Lint and check formatting of the Python code and the notebooks"
sequence = ["ruff check . ../notebooks", "ruff format --check . ../notebooks"]
default_item_type = "cmd"

[tool.poe.tasks.fmt]
help = "Fix lint issues and format the Python code and the notebooks"
sequence = ["ruff check --fix . ../notebooks", "ruff format . ../notebooks"]
default_item_type = "cmd"

[tool.poe.tasks.typecheck]
help = "Type-check the Python code with pyrefly"
cmd = "pyrefly check"

[tool.poe.tasks.golden]
help = "Golden tests: substrait-check output on every plan in tests/fixtures"
cmd = "tests/run.sh"
cwd = "${POE_ROOT}/.."

[tool.poe.tasks.test]
help = "The fast Python tests (not `slow`, a tenth of the Hypothesis examples) on 2 workers; see tests/conftest.py"
cmd = "pytest -n auto --dist worksteal -m 'not slow'"
env = { PYTEST_XDIST_AUTO_NUM_WORKERS.default = "2", SVERIFY_PROFILE.default = "dev" }

[tool.poe.tasks.test-all]
help = "Every Python test with full Hypothesis counts, on every core (as CI and qa run them)"
cmd = "pytest -n auto --dist worksteal"
env = { SVERIFY_PROFILE.default = "ci" }

[tool.poe.tasks.test-chaos]
help = "Crash injection into pipeline execution (tests/chaos), streamed to a ledger and summarised; not in qa or CI, run it on homelab"
shell = """
export SVERIFY_CHAOS_RUN="${SVERIFY_CHAOS_RUN:-$(python -m sverify_dev.chaos run-id)}"
export SVERIFY_CHAOS_LEDGER="${SVERIFY_CHAOS_LEDGER:-$(python -m sverify_dev.chaos path)}"
echo "chaos ledger: $SVERIFY_CHAOS_LEDGER"
pytest -n auto --dist worksteal -m chaos tests/chaos; status=$?
python -m sverify_dev.chaos summarize "$SVERIFY_CHAOS_LEDGER"
exit $status
"""
env = { SVERIFY_PROFILE.default = "ci", SVERIFY_CHAOS_EXAMPLES.default = "2000" }

[tool.poe.tasks.test-core]
help = "Python tests of Lean and DataFusion as the reference (see tests/conftest.py)"
cmd = "pytest -n auto --dist worksteal -m core"

[tool.poe.tasks.test-datafusion]
help = "Python tests of DataFusion as an engine"
cmd = "pytest -n auto --dist worksteal -m datafusion"

[tool.poe.tasks.test-duckdb]
help = "Python tests of the DuckDB engine and its SQL"
cmd = "pytest -n auto --dist worksteal -m duckdb"

[tool.poe.tasks.test-polars]
help = "Python tests of the Polars engine"
cmd = "pytest -n auto --dist worksteal -m polars"

[tool.poe.tasks.test-snowflake]
help = "Python tests of the Snowflake SQL (on fakesnow)"
cmd = "pytest -n auto --dist worksteal -m snowflake"

[tool.poe.tasks.test-spark]
help = "Python tests of the Spark SQL (on a local Spark session, which needs a JVM)"
cmd = "pytest -n auto --dist worksteal -m spark"

[tool.poe.tasks.oracle-a]
help = "Oracle A: the lift against DuckDB on the benchmarks and the replay's decided files, against the ledgers"
cmd = "python -m sverify_dev.oracle --jobs 4"

[tool.poe.tasks.fuzz]
help = "Random queries with Lean as the oracle for $BUDGET seconds (default 600); prints new findings"
cmd = "python -m sverify_dev.fuzz --budget ${BUDGET}"
env = { BUDGET.default = "600" }

[tool.poe.tasks.fuzz-duckdb]
help = "DuckDB's own SQL against Rel.eval, each of $FUZZ_TARGETS for $BUDGET seconds; ledgers to $FUZZ_OUT"
shell = "for t in ${FUZZ_TARGETS}; do python -m sverify_dev.duckdb_fuzz $t --budget ${BUDGET} --out ${FUZZ_OUT} || exit 1; done"
env = { BUDGET.default = "600", FUZZ_TARGETS.default = "eval_order float_special", FUZZ_OUT.default = "../characterization/duckdb" }

[tool.poe.tasks.notebooks]
help = "Check the tour notebooks with marimo and run each one headless"
shell = """
marimo check --strict [0-9]*.py ../catalogue/backend_semantics.py || exit 1
out=$(mktemp -d)
for nb in [0-9]*.py ../catalogue/backend_semantics.py; do
  echo "running $nb"
  marimo export html "$nb" -o "$out/$(basename "${nb%.py}").html" > /dev/null || exit 1
done
rm -rf "$out"
"""
cwd = "${POE_ROOT}/../notebooks"

[tool.poe.tasks.docs_pages]
help = "Write the site's generated pages (examples/, ledgers/) from docs/ and the ledgers' JSON"
cmd = "python scripts/docs_pages.py"

[tool.poe.tasks.docs]
help = "Build the API reference site into great-docs/_site (needs Quarto and the docs group)"
sequence = ["docs_pages", { cmd = "great-docs build" }]

[tool.poe.tasks.docs_preview]
help = "Build the API reference site and serve it locally"
sequence = ["docs_pages", { cmd = "great-docs preview" }]

[tool.poe.tasks.qa]
help = "Run everything: prove, build, lint, typecheck, golden, test-all, notebooks"
sequence = ["prove", "build", "lint", "typecheck", "golden", "test-all", "notebooks"]
