# Great Docs configuration for the sverify API reference (`uv run poe docs`).
# See https://posit-dev.github.io/great-docs/user-guide/03-configuration.html
#
# The landing page is this directory's README.md (the PyPI page). The notebook
# tour is linked on molab, not embedded: the notebooks call the native Lean
# checker, so they can't run in the browser.

module: sverify

display_name: "sverify"

# The logo is a check mark, what the checker proves. Great Docs shows it in
# the navbar and derives the favicon from it (it only writes a favicon when a
# logo exists).
logo:
  light: assets/logo.svg
  show_title: true

# Quarto already titles pages "<page> – sverify"; the default template would
# append the site name again ("sverify | sverify" on the home page).
seo:
  title_template: "{page_title}"

navbar_style: "sky"

parser: google

# Static analysis (griffe reads the source). Runtime introspection resolves
# `io.DeltaSource` as an attribute of `sverify`, and `import sverify` doesn't
# import all of its submodules (`sverify.io` loads delta-rs and pyiceberg
# lazily).
dynamic: false

# Sections in the order a data engineer looks for things: what a transform
# promises, how its result is built, stored and kept up to date, where its
# tables live, where it runs, how to test it, what can go wrong. Each entry
# is a public name, and each public name has an entry, as `docs/stability.md`
# defines them (`tests/test_public_api.py` holds the two equal).
reference:
  - title: Contracts
    desc: >
      State what a transformation assumes and promises, and have it proved
      before any data runs.
    contents:
      - transform
      - verify
      - ContractedTransform
      - Report
      - Verdict
      - unique
      - key
      - references
      - max_rows
      - rows_per
      - non_overlapping
      - arrives_within
      - approx
      - within
      - equivalent
      - types.Unique
      - types.Key
      - types.References
      - types.MaxRows
      - types.RowsPer
      - types.NonOverlapping
      - types.ArrivesWithin
      - types.Approx
      - types.PlannedCondition

  - title: What a report holds
    desc: >
      The types a `Report` holds: its issues and the preconditions that
      would settle them, each postcondition and how it was established, the
      observation, and the routes to each engine (`sverify.types`).
    contents:
      - types.Issue
      - types.Needed
      - types.CheckedCondition
      - types.Discharged
      - types.Counterexample
      - types.ColumnFacts
      - types.Observation
      - types.Within
      - types.Route
      - types.DialectDifference

  - title: Transforms, nodes and refresh
    desc: >
      A source piped into a contracted transform, `orders.pipe(paid)`, builds
      a node. Nodes compose left to right with `.pipe`, are stored with
      `.write(sink)`, and are kept up to date by `.refresh()`,
      with update plans proved equal to a full recompute.
    contents:
      - Node
      - sql
      - types.SQLStep
      - group
      - io.Changes
      - types.Group
      - types.Refresh
      - types.StageRefresh
      - types.BatchRefresh
      - types.SourceRefresh
      - types.QuarantineReport
      - types.RetentionReport
      - types.Status
      - types.NodeStatus

  - title: Sources and sinks
    desc: >
      Delta Lake and Iceberg tables as versioned sources, sources of
      preconditions, and sinks that carry the contract (`sverify.io`).
    contents:
      - io.DeltaSource
      - io.DeltaSink
      - io.IcebergSource
      - io.IcebergSink
      - io.StaticSource
      - io.FlightSource
      - io.SinkWrite
      - io.Contract
      - io.Storage

  - title: Credentials
    desc: >
      Credentials by reference: a `Secret` names where a value lives and
      is read through the `Resolver` that `set_resolver` installs, and a
      node lists the credentials it uses per table (`CredentialUse`;
      `sverify.io`).
    contents:
      - io.Secret
      - io.Resolver
      - io.set_resolver
      - io.CredentialUse

  - title: Your own sources and sinks
    desc: >
      Read from an API, a database or a folder of files with one `read`
      method, and write anywhere with one `write` method; sverify keeps the
      versions, the changes, the contract and the exactly-once writes.
      Table formats with metadata implement the full `VersionedSource`
      protocol.
    contents:
      - io.Source
      - io.Batch
      - io.from_query
      - io.from_frame
      - io.from_files
      - io.Sink
      - io.SinkChange
      - io.sink_from
      - io.VersionedSource
      - io.Snapshot
      - io.SourceBatch
      - io.Fact
      - io.Stored

  - title: Engines and SQL
    desc: >
      Run a checked plan on DuckDB, Polars or Spark, or write it
      as DuckDB, Snowflake or Spark SQL (`Node.to_sql`, `Report.to_sql`;
      `sverify.engines`). `Dialect`'s SQL-writing methods change as functions
      land, so they are left out; subclassing it is outside the 1.x promise.
      So are `Native`'s members, while the native scans move into the engine
      packages.
    contents:
      - connect
      - engines.run
      - engines.ENGINES
      - engines.Connection
      - name: engines.Native
        members: []
      - name: engines.Dialect
        members: [name, guards, finite, decimals]
      - engines.UnsupportedError
      - engines.run_sharded
      - engines.Sharded

  - title: ASOF joins
    desc: Align two time series, each row with the latest earlier row of the other.
    contents:
      - asof_join

  - title: Plans
    desc: >
      The low-level layer: Substrait plans, Lean's written form of them, the
      SQL of a plan, and the update plans of incremental maintenance
      (`sverify.engines.plan`). They take sverify's internal plan, so the module
      is outside the 1.x promise and may change in a minor release;
      `Node.to_sql`, `Report.to_sql` and `Report.to_substrait` are the stable
      way to a plan.
    contents:
      - engines.plan.to_sql
      - engines.plan.substrait_json
      - engines.plan.written_plan
      - engines.plan.delta_plans

  - title: Testing
    desc: >
      Test transforms and their contracts with pytest (`sverify.testing`).
      Installing sverify registers a pytest plugin with the fixtures
      `sv_source` (in-memory sources) and `sv_engine` (a test per installed
      engine).
    contents:
      - testing.assert_contract
      - testing.assert_engines_agree
      - testing.cases
      - testing.source
      - testing.installed_engines
      - testing.FlightLog
      - testing.LeanRaised

  - title: Command line
    desc: >
      The `sverify` command (`sverify.cli`): `check` (with `--diff` and
      `--fix`) and `refresh` a pipeline's file, `explain` a finding's code,
      and `contract export`, from a shell, a CI job or an agent.
    contents:
      - cli.main
      - cli.discover
      - cli.summary
      - cli.Discovery
      - cli.Checked

  - title: Standards
    desc: >
      Contracts in the Open Data Contract Standard (`sverify.odcs`):
      a node's contract written as ODCS, and ODCS contracts read as
      conditions.
    contents:
      - odcs.export
      - odcs.write
      - odcs.read
      - odcs.OdcsContract
      - odcs.Unread
      - odcs.UnreadRuleWarning

  - title: Lineage
    desc: >
      OpenLineage run events from `refresh`, and upstream events read back
      (`sverify.openlineage`).
    contents:
      - openlineage.Lineage
      - openlineage.read
      - openlineage.marquez
      - openlineage.Events
      - openlineage.Upstream
      - openlineage.Assertion
      - openlineage.LineageWarning

  - title: Errors
    desc: >
      What sverify raises, and when (`sverify.errors`). Every exception is a
      `SverifyError` with a `code`; every warning a `SverifyWarning`.
    contents:
      - errors.SverifyError
      - errors.VerificationError
      - errors.CompositionError
      - errors.UnverifiedRunError
      - errors.PreconditionError
      - errors.PostconditionError
      - errors.ConditionError
      - errors.SchemaError
      - errors.AuditError
      - errors.RouteError
      - errors.NotIncrementalError
      - errors.ConcurrentWriteError
      - errors.UnsupportedError
      - errors.SqlError
      - errors.ExportError
      - errors.MemoryLimitError
      - errors.CheckerVersionError
      - errors.EngineVersionError
      - errors.EngineSettingsError
      - errors.SecretError

  - title: Warnings
    desc: What sverify warns about (`sverify.errors`).
    contents:
      - errors.SverifyWarning
      - errors.UnverifiedRunWarning
      - errors.UnprovedWarning
      - errors.InferredWarning
      - errors.EngineVersionWarning
      - errors.EngineSettingsWarning
      - errors.ProfilePendingWarning
      - errors.ProfilePluginWarning

# Agent skills for sverify users, written by hand and shipped in the wheel
# (`sverify/skills/<name>/SKILL.md`, with their `references/`). The site
# publishes them under `.well-known/agent-skills/` with a Skills page;
# `tests/test_skills.py` runs their code.
skill:
  enabled: true
  well_known: true
  skills:
    - name: sverify
      file: src/sverify/skills/sverify/SKILL.md
    - name: sverify-pipelines
      file: src/sverify/skills/sverify-pipelines/SKILL.md
    - name: sverify-engines
      file: src/sverify/skills/sverify-engines/SKILL.md

# Pages beyond the API reference, written before each build by
# `scripts/docs_pages.py` (`poe docs` runs it) into directories git ignores:
# the on-ramp (`docs/getting-started.md`, at `examples/examples.html`); the reference pages (what a plan
# means, what 1.x keeps) and the design pages of `docs/`, by the kinds
# `docs/README.md` maps, without the pages for contributors; and the ledgers, rendered from their
# JSON (`upstream/bugs/`, `engines/<engine>/facts/`,
# `characterization/areas.json`, `docs/realizability.md`). Quarto's search
# indexes every entry by its heading.
sections:
  - title: Getting started
    dir: examples
  - title: Semantics
    dir: semantics
  - title: Design
    dir: design
  - title: Ledgers
    dir: ledgers

jupyter: python3
